tion-delay:.75s}\n.slide.cycle.active .f6arw.a3 path:first-child{animation-delay:1s}\n.slide.cycle.active .f6arw.a4 path:first-child{animation-delay:1.25s}\n.fig6 .f6arw .hd{opacity:0;}\n.slide.cycle.active .f6arw .hd{animation:mFade .5s ease-out forwards;}\n.slide.cycle.active .f6arw.a1 .hd{animation-delay:1.3s}\n.slide.cycle.active .f6arw.a2 .hd{animation-delay:1.55s}\n.slide.cycle.active .f6arw.a3 .hd{animation-delay:1.8s}\n.slide.cycle.active .f6arw.a4 .hd{animation-delay:2.05s}\n\n/* ---- the levels: rings scale open from the centre, outermost first ---- */\n.fig7-holder:not(.in) .f7c{opacity:0; transform:translate(-50%,-50%) scale(.82);}\n.fig7-holder.in .f7c{animation:mRing .95s var(--ease) both;}\n.fig7-holder.in .f7c.c2{animation-delay:.14s}\n.fig7-holder.in .f7c.c3{animation-delay:.28s}\n.fig7-holder.in .f7c.c4{animation-delay:.42s}\n.fig7-holder:not(.in) .f7key li{opacity:0; transform:translateX(22px);}\n.fig7-holder.in .f7key li{animation:mSlideR .7s var(--ease) both; animation-delay:.5s;}\n.fig7-holder.in .f7key li:nth-child(2){animation-delay:.6s}\n.fig7-holder.in .f7key li:nth-child(3){animation-delay:.7s}\n.fig7-holder.in .f7key li:nth-child(4){animation-delay:.8s}\n\n/* ---- the big claims land by scale, not by travel ---- */\n.argument .argument-big[data-reveal],.closing .closing-big[data-reveal]{transform:scale(.96);}\n.argument .argument-big[data-reveal].in,.closing .closing-big[data-reveal].in{transform:none;}\n\n/* ---- sources and types stagger ---- */\n.src-grid:not(.in) .src-card{opacity:0; transform:translateY(28px);}\n.src-grid.in .src-card{animation:mRise .8s var(--ease) both;}\n.src-grid.in .src-card:nth-child(2){animation-delay:.13s}\n.src-grid.in .src-card:nth-child(3){animation-delay:.26s}\nbody.hstory .slide.types:not(.active) .type-btn{opacity:0; transform:translateX(-24px);}\nbody.hstory .slide.types.active .type-btn{animation:mSlideL .65s var(--ease) both;}\nbody.hstory .slide.types.active .type-btn:nth-child(2){animation-delay:.1s}\nbody.hstory .slide.types.active .type-btn:nth-child(3){animation-delay:.2s}\n\n/* ---- matrix: headers arrive along their own axis ---- */\n.matrix:not(.in) .mx-col-h{opacity:0; transform:translateY(-18px);}\n.matrix.in .mx-col-h{animation:mDrop .6s var(--ease) both;}\n.matrix.in .mx-col-h:nth-of-type(2){animation-delay:.08s}\n.matrix.in .mx-col-h:nth-of-type(3){animation-delay:.16s}\n.matrix:not(.in) .mx-row-h{opacity:0; transform:translateX(-18px);}\n.matrix.in .mx-row-h{animation:mSlideL .6s var(--ease) both; animation-delay:.2s;}\n.matrix:not(.in) .mx-cell{opacity:0;}\n.matrix.in .mx-cell{animation:mFade .5s ease-out both; animation-delay:.34s;}\n\n/* ---- gist columns rise in sequence ---- */\n.gist-cols .gcol[data-reveal]{transform:translateY(30px);}\n.gist-cols .gcol[data-reveal].in{transform:none;}\n.gist-cols .gcol:nth-child(2)[data-reveal]{transition-delay:.14s;}\n.gist-cols .gcol:nth-child(3)[data-reveal]{transition-delay:.28s;}\n\n/* ---- decision-type panels: the incoming card builds row by row ---- */\n.type-panel.active{animation:mRise .34s var(--ease) both;}\n.type-panel.active dl > div{animation:mRise .42s var(--ease) both;}\n.type-panel.active dl > div:nth-child(1){animation-delay:.06s}\n.type-panel.active dl > div:nth-child(2){animation-delay:.14s}\n.type-panel.active dl > div:nth-child(3){animation-delay:.22s}\n\n/* ============================================================\n   AMBIENT — only on the slide you are looking at\n   ============================================================ */\n.slide.active .gicon,.slide.active .sicon,.slide.active .f6ico,\n.slide.active .micon,.slide.active .f7dot{animation:mBob 6s ease-in-out infinite;}\n.slide.active .gicon{animation-delay:0s}\n.slide.active .sicon:nth-of-type(1){animation-delay:.4s}\n.slide.active .f6ico{animation-duration:7s}\n.slide.active .f7dot{animation-duration:8s}\n.slide.active .stat-num{animation:mBreathe 7s ease-in-out infinite;}\n\n@keyframes mRise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}\n@keyframes mSlideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}\n@keyframes mSlideR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}\n@keyframes mDrop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}\n@keyframes mFade{from{opacity:0}to{opacity:1}}\n@keyframes mRing{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}\n@keyframes mDraw{to{stroke-dashoffset:0}}\n@keyframes mBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}\n@keyframes mBreathe{0%,100%{opacity:1}50%{opacity:.82}}\n\n/* the ring markers sit on a stroke, so they bob from their own origin */\n.slide.active .f7dot{animation-name:mBobDot;}\n@keyframes mBobDot{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 4px))}}\n}\n\n.no-motion [data-reveal] *,.no-motion .f6arw path,.no-motion .f7c,.no-motion .src-card,\n.no-motion .type-btn,.no-motion .mx-cell,.no-motion .mx-col-h,.no-motion .mx-row-h,\n.no-motion .cons-card,.no-motion .subrq-item,.no-motion .f7key li,.no-motion .type-btn{opacity:1 !important; transform:none !important; animation:none !important; stroke-dashoffset:0 !important;}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"progress\" id=\"progress\"><\u002Fdiv>\n\n<header class=\"topnav\">\n  <a class=\"brand\" href=\"#top\"><span class=\"mk\"><\u002Fspan> The Missing&nbsp;Why<\u002Fa>\n  <nav>\n    <a href=\"#scenario\">The problem<\u002Fa>\n    <a href=\"#research\">The study<\u002Fa>\n    <a href=\"#findings\">What I found<\u002Fa>\n    <a href=\"#cycle\">Making sense<\u002Fa>\n    <a href=\"#types\">What helps<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs>\n<symbol id=\"s-cube\" viewBox=\"0 0 120 120\"><path d=\"M60,12 L108,38 L60,64 L12,38 Z\" fill=\"var(--f1)\"><\u002Fpath><path d=\"M12,38 L60,64 L60,110 L12,84 Z\" fill=\"var(--f2)\"><\u002Fpath><path d=\"M108,38 L60,64 L60,110 L108,84 Z\" fill=\"var(--f3)\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"s-cyl\" viewBox=\"0 0 120 120\"><path d=\"M16,34 L16,84 A44,20 0 0 0 104,84 L104,34 Z\" fill=\"var(--f2)\"><\u002Fpath><ellipse cx=\"60\" cy=\"34\" rx=\"44\" ry=\"20\" fill=\"var(--f1)\"><\u002Fellipse><\u002Fsymbol>\n<symbol id=\"s-prism\" viewBox=\"0 0 120 120\"><path d=\"M60,16 L14,94 L60,94 Z\" fill=\"var(--f1)\"><\u002Fpath><path d=\"M60,16 L106,94 L60,94 Z\" fill=\"var(--f2)\"><\u002Fpath><ellipse cx=\"60\" cy=\"94\" rx=\"46\" ry=\"14\" fill=\"var(--f3)\"><\u002Fellipse><\u002Fsymbol>\n<symbol id=\"s-hex\" viewBox=\"0 0 120 120\"><path d=\"M60,8 L112,34 L112,86 L60,112 L8,86 L8,34 Z\" fill=\"var(--f1)\"><\u002Fpath><path d=\"M60,60 L112,34 L112,86 L60,112 Z\" fill=\"var(--f2)\"><\u002Fpath><path d=\"M60,60 L8,34 L8,86 L60,112 Z\" fill=\"var(--f3)\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"s-dome\" viewBox=\"0 0 120 120\"><path d=\"M14,82 A46,46 0 0 1 106,82 Z\" fill=\"var(--f1)\"><\u002Fpath><path d=\"M60,36 A46,46 0 0 1 106,82 L60,82 Z\" fill=\"var(--f2)\"><\u002Fpath><ellipse cx=\"60\" cy=\"82\" rx=\"46\" ry=\"13\" fill=\"var(--f3)\"><\u002Fellipse><\u002Fsymbol>\n<symbol id=\"s-star\" viewBox=\"0 0 120 120\"><path d=\"M60,10 L74,48 L114,50 L82,74 L93,113 L60,90 L27,113 L38,74 L6,50 L46,48 Z\" fill=\"var(--f1)\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"s-slab\" viewBox=\"0 0 120 120\"><path d=\"M60,20 L104,42 L60,64 L16,42 Z\" fill=\"var(--f1)\"><\u002Fpath><path d=\"M16,42 L60,64 L60,90 L16,68 Z\" fill=\"var(--f2)\"><\u002Fpath><path d=\"M104,42 L60,64 L60,90 L104,68 Z\" fill=\"var(--f3)\"><\u002Fpath><\u002Fsymbol>\n<symbol id=\"s-hexprism\" viewBox=\"0 0 120 120\"><path d=\"M104,50 L104,82 L82,103 L38,103 L16,82 L16,50 L38,71 L82,71 Z\" fill=\"var(--f2)\"><\u002Fpath><path d=\"M104,50 L82,71 L38,71 L16,50 L38,29 L82,29 Z\" fill=\"var(--f1)\"><\u002Fpath><\u002Fsymbol>\n<\u002Fdefs><\u002Fsvg>\n<!-- ============ INTRO · scrolltelling ============ -->\n<section class=\"intro\" id=\"top\">\n  <div class=\"intro-pin\">\n    <div class=\"intro-copy\">\n      <h1 class=\"intro-title\" id=\"introTitle\"><span class=\"l\">The<\u002Fspan><span class=\"l\">missing <em>why<\u002Fem><\u002Fspan><\u002Fh1>\n      <p class=\"icap\" data-cap=\"0\">Every digital product you use<\u002Fp>\n      <p class=\"icap\" data-cap=\"1\">is made of thousands of <b>decisions<\u002Fb>.<\u002Fp>\n      <p class=\"icap\" data-cap=\"2\">Why those <em>decisions<\u002Fem> were made quietly disappears.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"intro-shapes\" id=\"introShapes\" aria-hidden=\"true\">\n      <svg class=\"sh\" data-sh=\"0\" viewBox=\"0 0 120 120\"><path d=\"M60,8 L112,34 L112,86 L60,112 L8,86 L8,34 Z\" fill=\"#B49CFF\"><\u002Fpath><path d=\"M60,60 L112,34 L112,86 L60,112 Z\" fill=\"#8E6FE8\"><\u002Fpath><path d=\"M60,60 L8,34 L8,86 L60,112 Z\" fill=\"#684AB8\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"sh\" data-sh=\"1\" viewBox=\"0 0 120 120\"><path d=\"M60,6 L79,50 L124,52 L88,80 L100,124 L60,98 L20,124 L32,80 L-4,52 L41,50 Z\" fill=\"#3BD08D\" transform=\"scale(.92) translate(5,5)\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"sh\" data-sh=\"2\" viewBox=\"0 0 120 120\"><ellipse cx=\"60\" cy=\"30\" rx=\"46\" ry=\"22\" fill=\"#FFC97A\"><\u002Fellipse><path d=\"M14,30 L14,90 A46,22 0 0 0 106,90 L106,30 Z\" fill=\"#E8A548\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"sh\" data-sh=\"3\" viewBox=\"0 0 120 120\"><rect x=\"16\" y=\"16\" width=\"88\" height=\"88\" rx=\"10\" fill=\"#4D82FF\"><\u002Frect><rect x=\"16\" y=\"60\" width=\"88\" height=\"44\" rx=\"10\" fill=\"#2B57D8\"><\u002Frect><\u002Fsvg>\n      <svg class=\"sh\" data-sh=\"4\" viewBox=\"0 0 120 120\"><circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"#B49CFF\"><\u002Fcircle><path d=\"M60,14 A46,46 0 0 1 60,106 Z\" fill=\"#8E6FE8\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"sh\" data-sh=\"5\" viewBox=\"0 0 120 120\"><path d=\"M60,10 L110,100 L10,100 Z\" fill=\"#FFC97A\"><\u002Fpath><path d=\"M60,10 L110,100 L60,100 Z\" fill=\"#E8A548\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"intro-end\" id=\"introEnd\">\n      <p class=\"intro-final\">This is the story of what happens at work when those <em>decisions<\u002Fem> can no longer be explained.<\u002Fp>\n      <div class=\"intro-meta\">\n        <div class=\"col\"><span class=\"t\">Master's thesis<\u002Fspan>Margo Gaińska<\u002Fdiv>\n        <div class=\"col\"><span class=\"t\">Programme<\u002Fspan>IDBM · Aalto University<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"intro-cue\" id=\"introCue\"><span>Scroll<\u002Fspan><i><\u002Fi><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"story\" id=\"story\">\n<div class=\"story-pin\">\n<div class=\"story-track\" id=\"storyTrack\">\n\n<!-- 2 · GIST -->\n<section class=\"slide gist hl-amber\" id=\"gist\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Start here<\u002Fspan> The short version<\u002Fp>\n  <div class=\"wrap\">\n    <div class=\"gist-cols\">\n      <div class=\"gcol\" data-reveal=\"\" data-reveal-d=\"1\">\n        <svg viewBox=\"0 0 120 120\" class=\"gicon p-lilac\" aria-hidden=\"true\"><use href=\"#s-cube\"><\u002Fuse><\u002Fsvg>\n        <h2>What I did<\u002Fh2>\n        <ul>\n          <li><b>Case study:<\u002Fb> large digital transformation programme<\u002Fli>\n          <li><b>Interviewed:<\u002Fb> new joiners, consultants, people who left<\u002Fli>\n          <li><b>Investigated:<\u002Fb> documentation, design files, design system<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"gcol\" data-reveal=\"\" data-reveal-d=\"2\">\n        <svg viewBox=\"0 0 120 120\" class=\"gicon p-amber\" aria-hidden=\"true\"><use href=\"#s-cyl\"><\u002Fuse><\u002Fsvg>\n        <h2>What I found<\u002Fh2>\n        <ul>\n          <li><b>Too much is written down<\u002Fb> to know what to trust<\u002Fli>\n          <li>Lots of knowledge lives in <b>people's heads<\u002Fb><\u002Fli>\n          <li><b>Speed of delivery<\u002Fb> is measured, recording decisions is not<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"gcol\" data-reveal=\"\" data-reveal-d=\"3\">\n        <svg viewBox=\"0 0 120 120\" class=\"gicon p-green\" aria-hidden=\"true\"><use href=\"#s-prism\"><\u002Fuse><\u002Fsvg>\n        <h2>What I propose<\u002Fh2>\n        <ul>\n          <li><b>Make hidden implications visible<\u002Fb><\u002Fli>\n          <li><b>Match work to the type of decision<\u002Fb><\u002Fli>\n          <li><b>Distribute ownership<\u002Fb> at the level where the work is done<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"marquee\" aria-hidden=\"true\">\n    <div class=\"marquee-track\">\n      <span class=\"m-item\">What gets built <em>remains<\u002Fem><\u002Fspan><span class=\"m-sep\"><\u002Fspan>\n      <span class=\"m-item m-ghost\">Why it was built fades<\u002Fspan><span class=\"m-sep\"><\u002Fspan>\n      <span class=\"m-item\">What gets built <em>remains<\u002Fem><\u002Fspan><span class=\"m-sep\"><\u002Fspan>\n      <span class=\"m-item m-ghost\">Why it was built fades<\u002Fspan><span class=\"m-sep\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3-7 · SCENARIO -->\n<section class=\"slide sc hl-cobalt\" id=\"scenario\">\n  <p class=\"kicker\"><span class=\"idx\">Part 1<\u002Fspan> The problem<\u002Fp>\n  <div class=\"wrap sc-stage\">\n    <div class=\"prop prop-app\" aria-hidden=\"true\"><div class=\"pa-bar\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><div class=\"pa-body\"><div class=\"pa-block b1\"><\u002Fdiv><div class=\"pa-block b2\"><\u002Fdiv><div class=\"pa-btn\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <p class=\"scenario-line\" data-reveal=\"\">A team agrees how something should work, and ships it. The product keeps the outcome: a flow, a component, a closed ticket. <span class=\"why\">The decisions are not kept with it.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide sc hl-cobalt\" id=\"scenario\">\n  <p class=\"kicker\"><span class=\"idx\">Part 1<\u002Fspan> The problem<\u002Fp>\n  <div class=\"wrap sc-stage\">\n    <div class=\"prop prop-chat\" aria-hidden=\"true\"><div class=\"bub bub-a\">Why does it work like this?<\u002Fdiv><div class=\"bub bub-b\">No idea. That was decided before I joined.<\u002Fdiv><div class=\"bub bub-c\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv><\u002Fdiv>\n    <p class=\"scenario-line\" data-reveal=\"\">Months later, new work reaches that decision. <span class=\"why\">Nobody can say why it was made.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide sc hl-cobalt\" id=\"scenario\">\n  <p class=\"kicker\"><span class=\"idx\">Part 1<\u002Fspan> The problem<\u002Fp>\n  <div class=\"wrap sc-stage\">\n    <div class=\"prop prop-files\" aria-hidden=\"true\"><div class=\"fcard f1\"><\u002Fdiv><div class=\"fcard f2\"><\u002Fdiv><div class=\"fcard f3\"><span>?<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <p class=\"scenario-line\" data-reveal=\"\">The people who agreed it have moved on. The files show the final design, <span class=\"why\">not the decisions behind it<\u002Fspan>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide sc hl-cobalt\" id=\"scenario\">\n  <p class=\"kicker\"><span class=\"idx\">Part 1<\u002Fspan> The problem<\u002Fp>\n  <div class=\"wrap sc-stage\">\n    <p class=\"hs-cons-title\" data-reveal=\"\">Now there are two options: <span class=\"why\">spend days reconstructing it, or guess<\u002Fspan>.<\u002Fp>\n    <div class=\"cons-row\" data-reveal=\"\" data-reveal-d=\"1\">\n      <div class=\"cons-card\"><b>Earlier work is done again.<\u002Fb><p>Questions that were already settled get investigated a second time.<\u002Fp><\u002Fdiv>\n      <div class=\"cons-card\"><b>Deadlines are missed.<\u002Fb><p>Reconstructing past decisions takes time nobody planned for.<\u002Fp><\u002Fdiv>\n      <div class=\"cons-card\"><b>Solved problems return.<\u002Fb><p>Problems earlier designs had already solved are reintroduced.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 8 · STATS -->\n<section class=\"slide matters hl-cobalt\" id=\"matters\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 1<\u002Fspan> The problem<\u002Fp>\n  <div class=\"wrap\">\n    <h2 class=\"big-statement\" data-reveal=\"\" data-reveal-d=\"1\">The <span class=\"why\">why<\u002Fspan> now disappears faster than ever.<\u002Fh2>\n    <div class=\"stat-row\">\n      <figure class=\"stat\" data-reveal=\"\" data-reveal-d=\"1\">\n        <div class=\"stat-num\" data-count=\"25\">25<span>%<\u002Fspan><\u002Fdiv>\n        <figcaption>\n          of designers in Finland planned to change jobs within a year, <b>up from 15%<\u002Fb> the year before. When people leave, they take the why with them.\n          <span class=\"src\">Ornamo, 2024<\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure class=\"stat\" data-reveal=\"\" data-reveal-d=\"2\">\n        <div class=\"stat-num stat-word\">Faster<\u002Fdiv>\n        <figcaption>\n          software releases leave documentation that is\n          <b>hard for anyone but its author to read<\u002Fb>, falls out of sync with the product, and is treated as waste rather than a resource.\n          <span class=\"src\">Review of 63 studies · Theunissen et&nbsp;al., 2021<\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 9 · RESEARCH RQ -->\n<section class=\"slide research hl-green\" id=\"research\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 2<\u002Fspan> The study<\u002Fp>\n  <div class=\"wrap\">\n    <div class=\"rq\" data-reveal=\"\" data-reveal-d=\"1\">\n      <span class=\"rq-tag\">The research question<\u002Fspan>\n      <p class=\"rq-q\">How do digital product teams make sense of <span class=\"why\">past design decisions<\u002Fspan>?<\u002Fp>\n      <p class=\"rq-plain\">In plain words: when past decisions are unexplained, how do teams work them out again, and what does it cost them?<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"subrq\" data-reveal=\"\" data-reveal-d=\"2\">\n      <div class=\"subrq-item\"><span class=\"n\">a<\u002Fspan> What practices are used to communicate the reasons behind design decisions?<\u002Fdiv>\n      <div class=\"subrq-item\"><span class=\"n\">b<\u002Fspan> How does understanding past design decisions influence ongoing work in digital product teams?<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 · THE CASE -->\n<section class=\"slide research-case hl-green\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 2<\u002Fspan> The study<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fig-lede\" data-reveal=\"\" data-reveal-d=\"1\">I went inside one programme<br><span class=\"why\">and read everything it left behind.<\u002Fspan><\u002Fp>\n    <div class=\"ledger\" data-reveal=\"\" data-reveal-d=\"2\">\n      <div class=\"ledger-head\">\n        <p class=\"kicker\"><span class=\"idx\">→<\u002Fspan> The case<\u002Fp>\n        <p class=\"ledger-desc\">Inside a large Finnish financial company rebuilding its digital services since 2021. Many teams, a mix of employees and consultants, spread across countries: exactly the conditions where the why gets lost.<\u002Fp>\n      <\u002Fdiv>\n      <ul class=\"ledger-rows\">\n        <li><span class=\"lv\">13<\u002Fspan><span class=\"lk\">people interviewed, one hour each<\u002Fspan><\u002Fli>\n        <li><span class=\"lv\">10<\u002Fspan><span class=\"lk\">design files, current and archived<\u002Fspan><\u002Fli>\n        <li><span class=\"lv\">~100<\u002Fspan><span class=\"lk\">tasks from the team's work-tracking tool<\u002Fspan><\u002Fli>\n        <li><span class=\"lv\">20<\u002Fspan><span class=\"lk\">pages of shared team documents<\u002Fspan><\u002Fli>\n        <li><span class=\"lv\">1<\u002Fspan><span class=\"lk\">shared library of reusable design parts<\u002Fspan><\u002Fli>\n      <\u002Ful>\n      <p class=\"ledger-foot\">Single embedded case study (Yin, 2009) · theoretically-informed thematic analysis (Braun &amp; Clarke, 2006), framed by Weick's sensemaking.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 11-15 · FINDINGS -->\n<section class=\"slide slide-finding hl-lilac\" id=\"findings\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 3<\u002Fspan> What I found<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fs-count\" data-reveal=\"\">Finding 1 of 5<\u002Fp>\n    <h2 class=\"finding-title\" data-reveal=\"\" data-reveal-d=\"1\">Too much is written down to know <span class=\"why\">what to trust<\u002Fspan>.<\u002Fh2>\n    <blockquote class=\"fq\" data-reveal=\"\" data-reveal-d=\"2\">There is so much in Confluence that has been there for years and I do not even know if it is still valid. Some of it is, some of it is not. There is no way to tell from the page itself.<\u002Fblockquote>\n    <div class=\"finding-meta\" data-reveal=\"\" data-reveal-d=\"3\">\n      <span class=\"pid\">P3<\u002Fspan><span class=\"prole\">Product delivery · consultant · ~6 months in<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"term-gloss\" data-reveal=\"\" data-reveal-d=\"3\">Confluence: a tool where teams keep their shared documents.<\u002Fp>\n    <p class=\"finding-note\" data-reveal=\"\" data-reveal-d=\"3\">Plenty is written down. But when nobody can tell what is still correct, more documents just mean more noise.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide slide-finding hl-lilac\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 3<\u002Fspan> What I found<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fs-count\" data-reveal=\"\">Finding 2 of 5<\u002Fp>\n    <h2 class=\"finding-title\" data-reveal=\"\" data-reveal-d=\"1\">The answers live in <span class=\"why\">people's heads<\u002Fspan>.<\u002Fh2>\n    <blockquote class=\"fq\" data-reveal=\"\" data-reveal-d=\"2\">I tried to find out why a decision was made. I asked one person, and they said ask this person. I asked the second person, they said ask the third. The third one said, I don't remember either, the person who knew left.<\u002Fblockquote>\n    <div class=\"finding-meta\" data-reveal=\"\" data-reveal-d=\"3\">\n      <span class=\"pid\">P5<\u002Fspan><span class=\"prole\">Product strategy &amp; delivery · in-house · ~2 years<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"finding-note\" data-reveal=\"\" data-reveal-d=\"3\">To find a reason, you ask around. That works, until the people who know leave.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide slide-finding hl-lilac\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 3<\u002Fspan> What I found<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fs-count\" data-reveal=\"\">Finding 3 of 5<\u002Fp>\n    <h2 class=\"finding-title\" data-reveal=\"\" data-reveal-d=\"1\">What nobody asks about stays <span class=\"why\">unsaid<\u002Fspan>.<\u002Fh2>\n    <blockquote class=\"fq\" data-reveal=\"\" data-reveal-d=\"2\">Sometimes I have things in my head that are not written down. If I am asked, I can answer. If I am not asked, the thing stays only in my head.<\u002Fblockquote>\n    <div class=\"finding-meta\" data-reveal=\"\" data-reveal-d=\"3\">\n      <span class=\"pid\">P7<\u002Fspan><span class=\"prole\">Product strategy &amp; delivery · consultant · ~2 years<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"finding-note\" data-reveal=\"\" data-reveal-d=\"3\">People remember things they never say. If nobody asks, it stays in their heads.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide slide-finding hl-lilac\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 3<\u002Fspan> What I found<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fs-count\" data-reveal=\"\">Finding 4 of 5<\u002Fp>\n    <h2 class=\"finding-title\" data-reveal=\"\" data-reveal-d=\"1\">Speed is measured. <span class=\"why\">Quality<\u002Fspan> is not.<\u002Fh2>\n    <blockquote class=\"fq\" data-reveal=\"\" data-reveal-d=\"2\">They are measured on how many tickets they deliver. A lot of velocity is looked at. We don't have any quality metrics on our tickets […]<\u002Fblockquote>\n    <div class=\"finding-meta\" data-reveal=\"\" data-reveal-d=\"3\">\n      <span class=\"pid\">P13<\u002Fspan><span class=\"prole\">Product delivery · consultant · ~2 years<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"term-gloss\" data-reveal=\"\" data-reveal-d=\"3\">Tickets: small units of work. Velocity: how many get finished per week.<\u002Fp>\n    <p class=\"finding-note\" data-reveal=\"\" data-reveal-d=\"3\">What gets counted gets done. Writing down decisions counts for nothing, so nobody does it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<section class=\"slide slide-finding hl-lilac\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 3<\u002Fspan> What I found<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fs-count\" data-reveal=\"\">Finding 5 of 5<\u002Fp>\n    <h2 class=\"finding-title\" data-reveal=\"\" data-reveal-d=\"1\">The most experienced stop asking <span class=\"why\">why<\u002Fspan>.<\u002Fh2>\n    <blockquote class=\"fq\" data-reveal=\"\" data-reveal-d=\"2\">My goal is to deliver. Why someone decided in the past like this and not differently, it was, it is gone.<\u002Fblockquote>\n    <div class=\"finding-meta\" data-reveal=\"\" data-reveal-d=\"3\">\n      <span class=\"pid\">P12<\u002Fspan><span class=\"prole\">Product strategy &amp; delivery · consultant · ~2 years<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"finding-note\" data-reveal=\"\" data-reveal-d=\"3\">Experienced people stop digging and move on. Finding old decisions is left to newcomers, who know the least.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 16 · FIGURE 6 · sensemaking cycle -->\n<section class=\"slide cycle hl-amber\" id=\"cycle\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 4<\u002Fspan> Making sense of it<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fig-lede\" data-reveal=\"\" data-reveal-d=\"1\">Nobody looks a lost reason up.<br><span class=\"why\">They rebuild it, from whatever is left.<\u002Fspan><\u002Fp>\n    <div class=\"fig6\">\n      <div class=\"f6box\" data-reveal=\"\" data-reveal-d=\"2\">\n        <svg viewBox=\"0 0 120 120\" class=\"f6ico p-cobalt\" aria-hidden=\"true\"><use href=\"#s-cube\"><\u002Fuse><\u002Fsvg><h3>Ecological change<\u002Fh3><p class=\"f6sub\">the trigger<\u002Fp><hr>\n        <ul>\n          <li>A new team member inherits a flow whose decisions are not visible<\u002Fli>\n          <li>Something in the product looks wrong or inconsistent<\u002Fli>\n          <li>New work reaches a past decision nobody can explain<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"f6box\" data-reveal=\"\" data-reveal-d=\"3\">\n        <svg viewBox=\"0 0 120 120\" class=\"f6ico p-lilac\" aria-hidden=\"true\"><use href=\"#s-hex\"><\u002Fuse><\u002Fsvg><h3>Enactment<\u002Fh3><p class=\"f6sub\">generating cues<\u002Fp><hr>\n        <ul>\n          <li>Searching documentation, reading tickets and user stories<\u002Fli>\n          <li>Opening design files; checking the functioning artefact<\u002Fli>\n          <li>Asking colleagues who might remember<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"f6box\" data-reveal=\"\" data-reveal-d=\"4\">\n        <svg viewBox=\"0 0 120 120\" class=\"f6ico p-amber\" aria-hidden=\"true\"><use href=\"#s-cyl\"><\u002Fuse><\u002Fsvg><h3>Retention<\u002Fh3><p class=\"f6sub\">storing accounts<\u002Fp><hr>\n        <ul>\n          <li>Mostly individual memory, which fades over time<\u002Fli>\n          <li>Personal annotations and change logs in design files and tickets<\u002Fli>\n          <li>Individual practices, not shared expectations<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"f6box\" data-reveal=\"\" data-reveal-d=\"5\">\n        <svg viewBox=\"0 0 120 120\" class=\"f6ico p-green\" aria-hidden=\"true\"><use href=\"#s-prism\"><\u002Fuse><\u002Fsvg><h3>Selection<\u002Fh3><p class=\"f6sub\">constructing accounts<\u002Fp><hr>\n        <ul>\n          <li>Combining documentation, artefact and people into a plausible account<\u002Fli>\n          <li>Weighing which documentation is still current<\u002Fli>\n          <li>Checking the account against the current situation<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <p class=\"f6note\">What is retained shapes<br>what the next person can find<\u002Fp>\n      <svg class=\"f6arw a1\" viewBox=\"0 0 60 30\" aria-hidden=\"true\"><path d=\"M2,22 C14,6 46,6 55,19\"><\u002Fpath><path class=\"hd\" d=\"M50,10 L58,20 L47,22 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"f6arw a2\" viewBox=\"0 0 30 60\" aria-hidden=\"true\"><path d=\"M8,2 C24,14 24,46 11,55\"><\u002Fpath><path class=\"hd\" d=\"M20,50 L10,58 L8,47 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"f6arw a3\" viewBox=\"0 0 60 30\" aria-hidden=\"true\"><path d=\"M58,8 C46,24 14,24 5,11\"><\u002Fpath><path class=\"hd\" d=\"M10,20 L2,10 L13,8 Z\"><\u002Fpath><\u002Fsvg>\n      <svg class=\"f6arw a4\" viewBox=\"0 0 30 60\" aria-hidden=\"true\"><path d=\"M22,58 C6,46 6,14 19,5\"><\u002Fpath><path class=\"hd\" d=\"M10,10 L20,2 L22,13 Z\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <p class=\"fig-cap\" data-reveal=\"\" data-reveal-d=\"5\">The loop people run when past decisions are unexplained. Adapted from Weick (1995).<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 16b · FIGURE 7 · multilevel conditions -->\n<section class=\"slide levels hl-amber\" id=\"levels\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 4<\u002Fspan> Making sense of it<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"fig-lede\" data-reveal=\"\" data-reveal-d=\"1\">Every level can fix what sits inside it.<br><span class=\"why\">None can fix the level above.<\u002Fspan><\u002Fp>\n    <div class=\"fig7-holder\" data-reveal=\"\" data-reveal-d=\"2\">\n      <div class=\"fig7\">\n        <span class=\"f7c c1\"><svg viewBox=\"0 0 120 120\" class=\"f7dot p-cobalt\" aria-hidden=\"true\"><use href=\"#s-hexprism\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"f7c c2\"><svg viewBox=\"0 0 120 120\" class=\"f7dot p-lilac\" aria-hidden=\"true\"><use href=\"#s-hex\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"f7c c3\"><svg viewBox=\"0 0 120 120\" class=\"f7dot p-green\" aria-hidden=\"true\"><use href=\"#s-prism\"><\u002Fuse><\u002Fsvg><\u002Fspan><span class=\"f7c c4\"><svg viewBox=\"0 0 120 120\" class=\"f7dot p-amber\" aria-hidden=\"true\"><use href=\"#s-cyl\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n      <svg class=\"f7wires\" id=\"f7wires\" aria-hidden=\"true\"><\u002Fsvg>\n      <ul class=\"f7key\">\n        <li><svg viewBox=\"0 0 120 120\" class=\"f7ico p-cobalt\" aria-hidden=\"true\"><use href=\"#s-hexprism\"><\u002Fuse><\u002Fsvg><b>Organisation<\u002Fb><span>culture, regulation, sector norms, what gets measured<\u002Fspan><\u002Fli>\n        <li><svg viewBox=\"0 0 120 120\" class=\"f7ico p-lilac\" aria-hidden=\"true\"><use href=\"#s-hex\"><\u002Fuse><\u002Fsvg><b>Programme<\u002Fb><span>decision authority, ownership of patterns and documentation, delivery incentives<\u002Fspan><\u002Fli>\n        <li><svg viewBox=\"0 0 120 120\" class=\"f7ico p-green\" aria-hidden=\"true\"><use href=\"#s-prism\"><\u002Fuse><\u002Fsvg><b>Team<\u002Fb><span>working conventions, who is brought into decisions when<\u002Fspan><\u002Fli>\n        <li><svg viewBox=\"0 0 120 120\" class=\"f7ico p-amber\" aria-hidden=\"true\"><use href=\"#s-cyl\"><\u002Fuse><\u002Fsvg><b>Individual<\u002Fb><span>recall, role identity<\u002Fspan><\u002Fli>\n      <\u002Ful>\n      <p class=\"fig7-note\">Outer layers frame and constrain inner layers<\u002Fp>\n    <\u002Fdiv>\n    <p class=\"fig-cap\" data-reveal=\"\" data-reveal-d=\"3\">Multilevel conditions for design decision sensemaking.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 17 · ARGUMENT -->\n<section class=\"slide argument dark hl-amber\" id=\"argument\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 4<\u002Fspan> Making sense of it<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"argument-big\" data-reveal=\"\" data-reveal-d=\"1\">\n      The difficulty is <span class=\"strike\">not caused by too little documentation<\u002Fspan>.\n      It is the absence of conditions that let documentation, artefacts, and people <span class=\"why\">together make past decisions navigable<\u002Fspan>.\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 17b · TORCH -->\n<section class=\"slide torch hl-amber\" id=\"torch\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 4<\u002Fspan> Making sense of it<\u002Fp>\n  <div class=\"wrap torch-wrap\">\n    <blockquote class=\"fq torch-q\" data-reveal=\"\">There is large contribution of the design leads who walk in this tunnel with a torch, bringing light. That this is a very important area that can really improve a lot; ignoring it is reckless, big risk.<\u002Fblockquote>\n    <div class=\"finding-meta\" data-reveal=\"\"><span class=\"pid\">P10<\u002Fspan><span class=\"prole\">Product delivery · consultant · ~1 year<\u002Fspan><\u002Fdiv>\n    <p class=\"finding-note torch-note\" data-reveal=\"\">What helps is not more paperwork. It is a map and a torch: knowing which decisions matter, and people who can point to where those decisions were made.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 18 · SOURCES -->\n<section class=\"slide sources hl-amber\" id=\"sources\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 4<\u002Fspan> Making sense of it<\u002Fp>\n  <div class=\"wrap\">\n    <h2 class=\"big-statement\" data-reveal=\"\" data-reveal-d=\"1\">Documentation, artefacts and people. <span class=\"why\">None is navigable alone.<\u002Fspan><\u002Fh2>\n    <div class=\"src-grid\" data-reveal=\"\" data-reveal-d=\"1\">\n      <article class=\"src-card\" data-src=\"\">\n        <div class=\"src-top\"><svg viewBox=\"0 0 120 120\" class=\"sicon p-cobalt\" aria-hidden=\"true\"><use href=\"#s-slab\"><\u002Fuse><\u002Fsvg><h3>What's written down<\u002Fh3><\u002Fdiv>\n        <p class=\"src-holds\">Design files, shared documents, task lists.<\u002Fp>\n        <div class=\"src-limit\"><span class=\"src-limit-tag\">Limit<\u002Fspan><p>Scattered across tools, often out of date, and they record what was decided, not why.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"src-card\" data-src=\"\">\n        <div class=\"src-top\"><svg viewBox=\"0 0 120 120\" class=\"sicon p-lilac\" aria-hidden=\"true\"><use href=\"#s-hex\"><\u002Fuse><\u002Fsvg><h3>The product<\u002Fh3><\u002Fdiv>\n        <p class=\"src-holds\">The product itself, exactly as it works today.<\u002Fp>\n        <div class=\"src-limit\"><span class=\"src-limit-tag\">Limit<\u002Fspan><p>Shows what was built, never why. You can't tell a careful choice from an accident.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n      <article class=\"src-card\" data-src=\"\">\n        <div class=\"src-top\"><svg viewBox=\"0 0 120 120\" class=\"sicon p-amber\" aria-hidden=\"true\"><use href=\"#s-cyl\"><\u002Fuse><\u002Fsvg><h3>The people<\u002Fh3><\u002Fdiv>\n        <p class=\"src-holds\">Colleagues who were in the room when it was decided.<\u002Fp>\n        <div class=\"src-limit\"><span class=\"src-limit-tag\">Limit<\u002Fspan><p>Memory fades, people leave, and you have to know who to ask.<\u002Fp><\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 19 · TYPES -->\n<section class=\"slide types hl-green\" id=\"types\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 5<\u002Fspan> What helps<\u002Fp>\n  <div class=\"wrap\">\n    <h2 class=\"big-statement\" data-reveal=\"\" data-reveal-d=\"1\">Not every decision needs <span class=\"why\">the same work<\u002Fspan>.<\u002Fh2>\n    <p class=\"types-hint\" data-reveal=\"\" data-reveal-d=\"2\">Three kinds of design decision. Each requires different work and different documentation. Click to read more.<\u002Fp>\n    <div class=\"types-ui\" data-reveal=\"\" data-reveal-d=\"1\">\n      <div class=\"types-pick\" role=\"tablist\">\n        <button class=\"type-btn active\" data-type=\"0\">\n          <svg viewBox=\"0 0 120 120\" class=\"ticon p-lilac\" aria-hidden=\"true\"><use href=\"#s-hex\"><\u002Fuse><\u002Fsvg><span class=\"type-k\">Type 01<\u002Fspan>\n          <span class=\"type-name\">Established by pattern<\u002Fspan>\n          <span class=\"type-ex\">it follows a template, like the standard button used everywhere<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"type-btn\" data-type=\"1\">\n          <svg viewBox=\"0 0 120 120\" class=\"ticon p-cobalt\" aria-hidden=\"true\"><use href=\"#s-slab\"><\u002Fuse><\u002Fsvg><span class=\"type-k\">Type 02<\u002Fspan>\n          <span class=\"type-name\">Constrained by rule<\u002Fspan>\n          <span class=\"type-ex\">it follows a requirement, like an accessibility law<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"type-btn\" data-type=\"2\">\n          <svg viewBox=\"0 0 120 120\" class=\"ticon p-green\" aria-hidden=\"true\"><use href=\"#s-prism\"><\u002Fuse><\u002Fsvg><span class=\"type-k\">Type 03<\u002Fspan>\n          <span class=\"type-name\">Made by the team<\u002Fspan>\n          <span class=\"type-ex\">a new choice, like what to build and what to leave out<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"types-detail\">\n        <div class=\"type-panel active\" data-tpanel=\"0\">\n          <dl>\n            <div><dt>The work<\u002Fdt><dd>Use the pattern correctly.<\u002Fdd><\u002Fdiv>\n            <div><dt>The why lives with<\u002Fdt><dd>Whoever owns the pattern.<\u002Fdd><\u002Fdiv>\n            <div><dt>Risk over time<\u002Fdt><dd>The pattern itself becomes a mystery no one can explain.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n        <div class=\"type-panel\" data-tpanel=\"1\">\n          <dl>\n            <div><dt>The work<\u002Fdt><dd>Recognise the rule, then follow it.<\u002Fdd><\u002Fdiv>\n            <div><dt>The why lives with<\u002Fdt><dd>The rule itself: the law or standard.<\u002Fdd><\u002Fdiv>\n            <div><dt>Risk over time<\u002Fdt><dd>It gets mistaken for a choice, and argued all over again.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n        <div class=\"type-panel\" data-tpanel=\"2\">\n          <dl>\n            <div><dt>The work<\u002Fdt><dd>Talk it through and decide together.<\u002Fdd><\u002Fdiv>\n            <div><dt>The why lives with<\u002Fdt><dd>The team that decided, and nowhere else.<\u002Fdd><\u002Fdiv>\n            <div><dt>Risk over time<\u002Fdt><dd class=\"risk-hot\">If nobody writes the reason down, it is gone.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 20 · MATRIX -->\n<section class=\"slide recs hl-green\" id=\"recommendations\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">Part 5<\u002Fspan> What helps<\u002Fp>\n  <div class=\"wrap\">\n    <div class=\"recs-head\" data-reveal=\"\" data-reveal-d=\"1\">\n      <h2 class=\"big-statement\">Three principles <span class=\"why\">for practice<\u002Fspan>.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"matrix\" data-reveal=\"\" data-reveal-d=\"2\">\n      <div class=\"mx-corner\"><\u002Fdiv>\n      <div class=\"mx-col-h\" data-col=\"0\"><svg viewBox=\"0 0 120 120\" class=\"micon p-amber\" aria-hidden=\"true\"><use href=\"#s-cyl\"><\u002Fuse><\u002Fsvg>Make hidden implications visible<span>of lost decisions<\u002Fspan><\u002Fdiv>\n      <div class=\"mx-col-h\" data-col=\"1\"><svg viewBox=\"0 0 120 120\" class=\"micon p-lilac\" aria-hidden=\"true\"><use href=\"#s-hex\"><\u002Fuse><\u002Fsvg>Match work to type of decision<span>documentation work to decision type<\u002Fspan><\u002Fdiv>\n      <div class=\"mx-col-h\" data-col=\"2\"><svg viewBox=\"0 0 120 120\" class=\"micon p-green\" aria-hidden=\"true\"><use href=\"#s-prism\"><\u002Fuse><\u002Fsvg>Distribute ownership<span>at the level where the work is done<\u002Fspan><\u002Fdiv>\n\n      <div class=\"mx-row-h\" data-row=\"0\">Organisation<span>culture, what gets measured<\u002Fspan><\u002Fdiv>\n      <button class=\"mx-cell\" data-row=\"0\" data-col=\"0\" data-label=\"Make implications visible\" data-symptom=\"Delivery is measured; quality costs (rework, recurring questions, reconstruction time) are not recognised\" data-signal=\"People are recognised for the quality of their work, not only for what they deliver\">Leadership integrates quality measures as part of success<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"0\" data-col=\"1\" data-label=\"Match work to decision type\" data-symptom=\"Patterns are rebuilt at lower levels because no one at organisational level is responsible for them\" data-signal=\"Across the organisation, teams apply shared rules and patterns\">Organisation-wide functions own shared patterns and rules, and keep them up to date<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"0\" data-col=\"2\" data-label=\"Distribute ownership\" data-symptom=\"Navigational work is informal and invisible in role definitions\" data-signal=\"The work continues across teams and does not depend on one person’s knowledge\">Navigational and curation work is recognised in role definitions<\u002Fbutton>\n\n      <div class=\"mx-row-h\" data-row=\"1\">Programme<span>authority, ownership<\u002Fspan><\u002Fdiv>\n      <button class=\"mx-cell\" data-row=\"1\" data-col=\"0\" data-label=\"Make implications visible\" data-symptom=\"Velocity is measured; rework is absorbed into delivery figures\" data-signal=\"Recurrence and rework are mentioned in programme reporting\">Track rework and reconstruction time alongside delivery<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"1\" data-col=\"1\" data-label=\"Match work to decision type\" data-symptom=\"The same kinds of decisions are remade across teams\" data-signal=\"Patterns and rules are referenced in new work instead of re-derived\">Assign owners to patterns and rules so teams apply rather than re-debate<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"1\" data-col=\"2\" data-label=\"Distribute ownership\" data-symptom=\"No role owns programme-wide documentation or cross-team decisions\" data-signal=\"Documentation has named owners; cross-team decisions have visible authors\">Name decision authority for cross-team work; assign curation responsibility<\u002Fbutton>\n\n      <div class=\"mx-row-h\" data-row=\"2\">Team<span>conventions, who is involved<\u002Fspan><\u002Fdiv>\n      <button class=\"mx-cell\" data-row=\"2\" data-col=\"0\" data-label=\"Make implications visible\" data-symptom=\"The same questions recur across sprints\" data-signal=\"Retrospectives reference specific past decisions, not only process\">Surface lost time and recurring questions in retrospectives<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"2\" data-col=\"1\" data-label=\"Match work to decision type\" data-symptom=\"Teams re-debate decisions a pattern or rule already settles\" data-signal=\"Fewer decisions reopened; clearer escalation when coverage is missing\">Check pattern or rule coverage before opening a decision<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"2\" data-col=\"2\" data-label=\"Distribute ownership\" data-symptom=\"Navigational knowledge sits with one long-tenured person\" data-signal=\"Newcomers can locate context without depending on one person\">Rotate the navigational role; name owners on artefacts<\u002Fbutton>\n\n      <div class=\"mx-row-h\" data-row=\"3\">Individual<span>recall, role identity<\u002Fspan><\u002Fdiv>\n      <button class=\"mx-cell\" data-row=\"3\" data-col=\"0\" data-label=\"Make implications visible\" data-symptom=\"Reconstruction hours go unrecorded\" data-signal=\"Individual workload includes reconstruction as a named activity\">Note when reconstruction work happens and how long it takes<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"3\" data-col=\"1\" data-label=\"Match work to decision type\" data-symptom=\"Past artefacts do not show whether a decision applied a pattern or deviated from it\" data-signal=\"Inherited artefacts carry traceable links or an explicit account\">Link to the pattern or rule if covered; record the decision if not<\u002Fbutton>\n      <button class=\"mx-cell\" data-row=\"3\" data-col=\"2\" data-label=\"Distribute ownership\" data-symptom=\"Own decisions fade within months\" data-signal=\"Personal artefacts remain interpretable to others later\">Annotate decisions when they are made, especially those not covered by pattern or rule<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"mx-detail\" id=\"mxDetail\" data-reveal=\"\" data-reveal-d=\"3\" aria-live=\"polite\">\n      <p class=\"mx-hint\">Select any move above to see the symptom it answers and the sign it is working.<\u002Fp>\n      <div class=\"mx-detail-body\" hidden=\"\">\n        <div class=\"mx-cols\">\n          <div><span class=\"mx-dt\">Symptom<\u002Fspan><p class=\"mx-sym\"><\u002Fp><\u002Fdiv>\n          <div><span class=\"mx-dt\">The move<\u002Fspan><p class=\"mx-int\"><\u002Fp><\u002Fdiv>\n          <div><span class=\"mx-dt\">Sign it is working<\u002Fspan><p class=\"mx-sig\"><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 21 · CLOSING -->\n<section class=\"slide closing hl-amber\" id=\"closing\">\n  <p class=\"kicker\" data-reveal=\"\"><span class=\"idx\">The end<\u002Fspan> In one line<\u002Fp>\n  <div class=\"wrap\">\n    <p class=\"closing-big\" data-reveal=\"\" data-reveal-d=\"1\">\n      The decisions are already there: in the documents, in the product, in the people. What is missing is <span class=\"why\">a way to navigate them together<\u002Fspan>.\n    <\u002Fp>\n  <\u002Fdiv>\n  <div class=\"mini-colo\">\n    <span>Making Sense of Past Design Decisions in Digital Product Teams<\u002Fspan>\n    <span>Margo Gaińska · IDBM · Aalto University<\u002Fspan>\n    <span>© 2026<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<div class=\"story-dots\" id=\"storyDots\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"story-count\" id=\"storyCount\">01 / 21<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ TWEAKS ============ -->\n<script>\nwindow.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"accent\": \"amber\",\n  \"motion\": true\n}/*EDITMODE-END*/;\n<\u002Fscript>\n<aside class=\"tweaks\" id=\"tweaks\" hidden=\"\">\n  <div class=\"tweaks-head\">\n    <span class=\"tweaks-title\">Tweaks<\u002Fspan>\n    <button class=\"tweaks-close\" id=\"tweaksClose\" aria-label=\"Close tweaks\">✕<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"tweaks-body\">\n    <div class=\"tweak-row\">\n      <span class=\"tweak-label\">Accent colour<\u002Fspan>\n      <div class=\"swatches\" id=\"accentSwatches\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tweak-row tweak-inline\">\n      <span class=\"tweak-label\">Motion &amp; animation<\u002Fspan>\n      <button class=\"tweak-switch\" id=\"motionToggle\" role=\"switch\" aria-checked=\"true\"><span class=\"knob\"><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Faside>\n\n\n<script src=\"1abdd797-a95a-422e-86cf-74f5977c0950\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
