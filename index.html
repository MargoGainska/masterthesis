        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

        }

    const resourceMap = {};

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   THE MISSING WHY — Helsinki Design Week exhibition site\n   Margo Gaińska · Master's thesis\n   Visual system: bold grotesque, alternating dark/light, one accent\n   Inspired by editorial research-report microsites\n   ============================================================ */\n\n:root{\n  /* dark ground — matched to the poster stock */\n  --bg:#1A1A1C;\n  --paper:#1A1A1C;\n  --paper-2:#232326;\n  --paper-3:#2D2D31;\n  --feature:#232326;   /* lifted panel for feature sections */\n  --ink:#F4F3F0;\n  --ink-2:#A8A7AF;\n  --muted:#A09FA8;\n  --line:rgba(244,243,240,0.12);\n  --line-strong:rgba(244,243,240,0.22);\n\n  /* lifted feature blocks */\n  --dark:#232326;\n  --dark-2:#2D2D31;\n  --on-dark:#F4F3F0;\n  --on-dark-2:#A6A5AE;\n  --line-dark:rgba(244,243,240,0.14);\n\n  /* accent — amber on dark ground (set live by JS) */\n  --accent:#FFC97A;\n  --accent-press:#E8A548;\n  --accent-ink:#16151C;\n  --accent-soft:rgba(255,201,122,0.14);\n  --accent-on-dark:#FFC97A;\n  --accent-on-dark-press:#E8A548;\n  --accent-on-dark-soft:rgba(255,201,122,0.16);\n\n  /* faded-reasoning device */\n  --ghost:rgba(244,243,240,0.22);\n\n  --display:\"Bricolage Grotesque\",ui-sans-serif,system-ui,sans-serif;\n  --sans:\"Hanken Grotesk\",ui-sans-serif,system-ui,-apple-system,sans-serif;\n  --mono:\"Hanken Grotesk\",ui-sans-serif,system-ui,-apple-system,sans-serif;\n\n  /* radii */\n  --radius:20px;\n  --radius-sm:12px;\n\n  /* ---- type scale (calmer, story-like) ---- */\n  --t-hero:    clamp(52px,7.5vw,104px);\n  --t-display: clamp(28px,3.8vw,52px);\n  --t-quote:   clamp(22px,2.7vw,36px);\n  --t-title:   clamp(21px,2.3vw,30px);\n  --t-stat:    clamp(56px,7.5vw,110px);\n\n  --maxw:1320px;\n  --gutter:clamp(20px,5vw,96px);\n  --ease:cubic-bezier(0.22,0.68,0.12,1);\n}\n\n*{box-sizing:border-box;}\nhtml{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;}\nbody{\n  margin:0; background:var(--paper); color:var(--ink);\n  font-family:var(--sans); font-size:18px; line-height:1.6; font-weight:400;\n  overflow-x:clip;\n}\n::selection{background:var(--accent); color:var(--accent-ink);}\na{color:inherit;}\nimg{max-width:100%;display:block;}\nbutton{margin:0; font:inherit; color:inherit; background:none; border:none; cursor:pointer; -webkit-appearance:none; appearance:none; text-align:inherit;}\n\n/* ---- layout helpers ---- */\n.wrap{max-width:var(--maxw); margin:0 auto; padding-inline:var(--gutter);}\nsection{position:relative;}\n\n/* feature block treatment — lifted panel on the dark ground */\n.dark{background:var(--feature); color:var(--ink);\n  --on-dark:var(--ink);\n  --on-dark-2:var(--ink-2);\n  --line-dark:rgba(244,243,240,0.16);\n  --dark:#2D2D31;\n  --dark-2:var(--accent-soft);\n}\n.dark .kicker{color:var(--muted);}\n.dark .kicker::before{background:var(--line-strong);}\n.dark .rule{background:var(--line);}\n\n/* ---- eyebrow / kicker: centered chapter marker ---- */\n.kicker{\n  font-family:var(--sans); font-weight:600; font-size:12px; letter-spacing:.13em;\n  text-transform:uppercase; color:var(--ink-2); display:flex; align-items:center; justify-content:center; gap:10px; text-align:center;\n}\n.kicker .idx{color:var(--accent);}\n.kicker .idx::after{content:\"·\"; margin-left:10px; color:var(--line-strong);}\n.kicker::before{content:none;}\n\n.rule{height:1px; background:var(--line); border:0; margin:0;}\n\n/* ---- reveal primitives (base hidden; .in = static visible) ---- */\n[data-reveal]{opacity:0; transform:translateY(26px);}\n[data-reveal].in{opacity:1; transform:none;}\n@media (prefers-reduced-motion: no-preference){\n  [data-reveal]{transition:opacity .85s var(--ease), transform .85s var(--ease);}\n  [data-reveal-d=\"1\"]{transition-delay:.08s;}\n  [data-reveal-d=\"2\"]{transition-delay:.16s;}\n  [data-reveal-d=\"3\"]{transition-delay:.24s;}\n  [data-reveal-d=\"4\"]{transition-delay:.32s;}\n  [data-reveal-d=\"5\"]{transition-delay:.40s;}\n}\n.no-motion [data-reveal]{opacity:1 !important; transform:none !important; transition:none !important;}\n\n/* ---- circular ring motif ---- */\n@keyframes spinslow{to{transform:rotate(360deg);}}\n.ring-rotate{transform-origin:center; animation:spinslow 34s linear infinite;}\n.no-motion .ring-rotate{animation:none;}\n.hero .wrap{position:relative; z-index:1;}\n.hero-rings{position:absolute; right:-7%; top:50%; transform:translateY(-50%); width:min(46vw,560px); z-index:0; pointer-events:none;}\n.hero-rings svg{width:100%; height:auto; display:block; overflow:visible;}\n@media(max-width:900px){ .hero-rings{display:none;} }\n.closing{position:relative; overflow:clip;}\n.closing .wrap{position:relative; z-index:1;}\n.closing-rings{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(88vw,640px); z-index:0; pointer-events:none;}\n.closing-rings svg{width:100%; height:auto; display:block; overflow:visible;}\n\n/* devices */\n.why{color:var(--accent);}\n.ghost{color:var(--line-strong);}\n.dark .ghost{color:var(--ink-2); opacity:.5;}\n\n/* ============================================================\n   PROGRESS + NAV\n   ============================================================ */\n.progress{position:fixed; top:0; left:0; height:3px; width:0; background:var(--accent); z-index:200; transition:width .12s linear;}\n.topnav{\n  position:fixed; top:0; left:0; right:0; z-index:150;\n  display:flex; align-items:center; justify-content:space-between;\n  padding:18px var(--gutter);\n  color:var(--ink); transition:color .35s var(--ease);\n}\n.topnav.on-dark{color:var(--on-dark);}\n.topnav .brand{font-family:var(--mono); font-size:13px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; display:flex; align-items:center; gap:9px; text-decoration:none;}\n.topnav .brand .mk{width:11px;height:11px;background:var(--accent);border-radius:50%;display:inline-block;}\n.topnav nav{display:flex; gap:24px;}\n.topnav nav a{\n  font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;\n  text-decoration:none; opacity:.78; transition:opacity .2s;\n}\n@media (hover:hover) and (pointer:fine){ .topnav nav a:hover{opacity:1;} }\n@media(max-width:820px){ .topnav nav{display:none;} }\n\n/* ============================================================\n   HERO  (light / lavender)\n   ============================================================ */\n.hero{min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding-block:120px 64px; position:relative; overflow:clip; text-align:center;}\n.hero .wrap{display:flex; flex-direction:column; align-items:center;}\n.hero-meta{display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(28px,4vw,72px); margin-top:clamp(40px,7vh,80px);}\n.hero-meta .col{font-family:var(--sans); font-size:14px; color:var(--ink); line-height:1.45;}\n.hero-meta .col .t{display:block; color:var(--accent); text-transform:uppercase; letter-spacing:.11em; font-size:10.5px; font-weight:600; margin-bottom:9px; white-space:nowrap;}\n.hero-meta .col b{color:var(--ink); font-weight:400;}\n\n.hero-body{display:grid; grid-template-columns:1.08fr 0.92fr; gap:clamp(24px,4vw,64px); align-items:center;}\n@media(max-width:860px){ .hero-body{grid-template-columns:1fr;} }\n\n.hero h1{\n  font-family:var(--display); font-weight:700; margin:0;\n  font-size:var(--t-hero); line-height:.88; letter-spacing:-.035em;\n}\n.hero h1 .line{display:block; overflow:hidden; padding-block:.02em;}\n.hero h1 .line span{display:block; animation:lineUp 1.15s var(--ease) both;}\n.hero h1 .line:nth-child(2) span{animation-delay:.12s;}\n@keyframes lineUp{from{transform:translateY(112%);} to{transform:translateY(0);}}\n.no-motion .hero h1 .line span{animation:none;}\n.hero h1 em{position:relative; font-style:normal; color:var(--accent); white-space:nowrap;}\n.hero h1 em::after{content:\"\"; position:absolute; left:0; right:0; bottom:.02em; height:.06em; background:var(--accent); transform:scaleX(0); transform-origin:left; animation:drawUnder 1s var(--ease) 1.15s forwards;}\n@keyframes drawUnder{to{transform:scaleX(1);}}\n.no-motion .hero h1 em::after{transform:scaleX(1); animation:none;}\n\n.hero-sub{\n  margin-top:clamp(28px,4vh,48px); max-width:560px; margin-inline:auto;\n  font-size:clamp(17px,1.5vw,21px); line-height:1.55; color:var(--ink-2); font-weight:400; text-wrap:pretty;\n}\n.hero-sub b{color:var(--ink); font-weight:600;}\n\n.scroll-cue{\n  position:absolute; bottom:30px; left:var(--gutter); right:var(--gutter);\n  display:flex; justify-content:space-between; align-items:center;\n  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2);\n}\n.scroll-cue .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 2.4s var(--ease) infinite;}\n\n/* ============================================================\n   TWEAKS PANEL\n   ============================================================ */\n.tweaks{\n  position:fixed; right:20px; bottom:20px; z-index:300; width:300px;\n  background:var(--paper-2); color:var(--ink); border:1px solid var(--line-strong); border-radius:var(--radius);\n  box-shadow:0 24px 60px rgba(0,0,0,.5); font-family:var(--sans); overflow:hidden;\n  animation:tweaksIn .4s var(--ease) both;\n}\n@keyframes tweaksIn{from{opacity:0; transform:translateY(16px);}to{opacity:1; transform:none;}}\n.tweaks[hidden]{display:none;}\n.tweaks-head{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line);}\n.tweaks-title{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink);}\n.tweaks-close{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--ink-2); font-size:13px; border:1px solid var(--line); transition:color .2s, border-color .2s;}\n@media (hover:hover) and (pointer:fine){ .tweaks-close:hover{color:var(--accent); border-color:var(--accent);} }\n.tweaks-body{padding:18px;}\n.tweak-row{margin-bottom:20px;}\n.tweak-row:last-child{margin-bottom:0;}\n.tweak-label{display:block; font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); margin-bottom:12px;}\n.tweak-inline{display:flex; align-items:center; justify-content:space-between;}\n.tweak-inline .tweak-label{margin-bottom:0;}\n.swatches{display:flex; gap:10px;}\n.swatch{width:30px; height:30px; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 2px var(--paper-2); cursor:pointer; transition:transform .2s var(--ease), border-color .2s;}\n@media (hover:hover) and (pointer:fine){ .swatch:hover{transform:scale(1.12);} }\n.swatch.sel{border-color:var(--ink);}\n.tweak-switch{position:relative; width:46px; height:26px; border-radius:20px; background:var(--paper-3); border:1px solid var(--line); transition:background .25s; cursor:pointer;}\n.tweak-switch[aria-checked=\"true\"]{background:var(--accent); border-color:var(--accent);}\n.tweak-switch .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#F4F3F0; box-shadow:0 1px 3px rgba(0,0,0,.4); transition:transform .25s var(--ease);}\n.tweak-switch[aria-checked=\"true\"] .knob{transform:translateX(20px);}\n@media(max-width:560px){ .tweaks{left:20px; right:20px; width:auto;} }\n@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(2);opacity:.35;}}\n\n/* touch: larger tap targets, no hover reliance */\n@media (hover:none){\n  .swatch{width:38px; height:38px;}\n  .tweaks-close{width:38px; height:38px;}\n  .tweak-switch{width:54px; height:32px;}\n  .tweak-switch .knob{width:26px; height:26px;}\n  .tweak-switch[aria-checked=\"true\"] .knob{transform:translateX(22px);}\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   THE MISSING WHY — section styles (grotesque system)\n   ============================================================ */\n\n/* ---------- shared big statement: centered story spine ---------- */\n.big-statement{\n  font-family:var(--display); font-weight:700; letter-spacing:-.025em; line-height:1.06;\n  font-size:var(--t-display); margin:clamp(24px,4vh,44px) auto 0; max-width:22ch; text-wrap:balance; text-align:center;\n}\n\n/* ---------- KINETIC MARQUEE ---------- */\n.marquee{overflow:hidden; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:clamp(18px,2.6vw,32px) 0; background:var(--paper);}\n.marquee-track{display:flex; align-items:center; gap:clamp(16px,1.8vw,30px); width:max-content; white-space:nowrap; animation:marquee 24s linear infinite;}\n@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}\n.no-motion .marquee-track{animation:none;}\n.m-item{flex:none; font-family:var(--display); font-weight:700; font-size:clamp(28px,4.6vw,62px); letter-spacing:-.03em; color:var(--ink); padding:0 .18em; line-height:1.12;}\n.m-item em{font-style:normal; color:var(--accent);}\n.m-ghost{color:transparent; -webkit-text-stroke:1.3px var(--line-strong);}\n.m-sep{width:13px; height:13px; border-radius:50%; background:var(--accent); flex:none;}\n\n/* ---------- GIST — mirrors the poster's three columns ---------- */\n.gist{padding-block:clamp(80px,13vh,150px);}\n.gist-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(28px,4vw,72px); margin-top:clamp(36px,6vh,64px);}\n.gcol{display:flex; flex-direction:column;}\n.gicon{width:clamp(44px,3.6vw,54px); height:auto; display:block; margin-bottom:clamp(18px,2.4vh,26px);}\n.gcol h2{margin:0 0 clamp(20px,2.8vh,30px); font-family:var(--display); font-weight:600; font-size:clamp(24px,2.6vw,36px); line-height:1; letter-spacing:-.028em; color:var(--ink);}\n.gcol ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:clamp(14px,2vh,20px);}\n.gcol li{font-size:clamp(15px,1.35vw,19px); line-height:1.45; color:var(--ink-2); text-wrap:pretty;}\n.gcol li b{color:var(--ink); font-weight:600;}\n@media(max-width:820px){ .gist-cols{grid-template-columns:1fr; gap:clamp(30px,5vh,44px);} }\n\n/* ---------- SCENARIO: pinned horizontal story ---------- */\n.scenario{border-top:1px solid var(--line);}\n.hs{height:420svh; position:relative;}\n.hs-pin{position:sticky; top:0; height:100svh; overflow:hidden; display:flex; flex-direction:column; justify-content:center;}\n.hs-kicker{position:absolute; top:clamp(72px,10vh,110px); left:0; right:0;}\n.hs-track{display:flex; will-change:transform;}\n.hs-panel{flex:0 0 100vw; min-height:60svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(30px,5vh,52px); padding-inline:var(--gutter);}\n.hs-panel .scenario-line{max-width:16ch;}\n.hs-dots{position:absolute; bottom:clamp(28px,5vh,54px); left:0; right:0; display:flex; justify-content:center; gap:9px;}\n.hs-dots i{width:8px; height:8px; border-radius:50%; background:var(--paper-3); transition:background .3s, transform .3s;}\n.hs-dots i.on{background:var(--accent); transform:scale(1.25);}\n.hs-cons-title{margin:0; font-family:var(--display); font-weight:600; font-size:var(--t-title); letter-spacing:-.02em;}\n.hs-panel-cons .cons-row{margin-top:0; max-width:1080px;}\n/* static fallback when motion is off */\n.no-motion .hs{height:auto;}\n.no-motion .hs-pin{position:static; height:auto; overflow:visible; padding-block:clamp(70px,10vh,120px) 40px;}\n.no-motion .hs-kicker{position:static; margin-bottom:clamp(30px,5vh,50px);}\n.no-motion .hs-track{transform:none !important; flex-direction:column; gap:clamp(48px,8vh,90px);}\n.no-motion .hs-panel{flex:none; min-height:0;}\n.no-motion .hs-dots{display:none;}\n\n/* ---- playful props (pure CSS) ---- */\n.prop{position:relative;}\n/* app window */\n.prop-app{width:min(300px,64vw); border:1.5px solid var(--line-strong); border-radius:14px; background:var(--paper-2); box-shadow:0 14px 34px rgba(0,0,0,.35); overflow:hidden;}\n.pa-bar{display:flex; gap:5px; padding:10px 12px; border-bottom:1px solid var(--line);}\n.pa-bar i{width:8px; height:8px; border-radius:50%; background:var(--paper-3);}\n.pa-bar i:first-child{background:var(--accent);}\n.pa-body{padding:16px; display:flex; flex-direction:column; gap:10px;}\n.pa-block{height:12px; border-radius:6px; background:var(--paper-3);}\n.pa-block.b1{width:70%;}\n.pa-block.b2{width:45%;}\n.pa-btn{width:96px; height:30px; border-radius:8px; background:var(--accent); margin-top:6px; animation:btnPop 2.6s var(--ease) infinite;}\n@keyframes btnPop{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}\n/* chat bubbles */\n.prop-chat{display:flex; flex-direction:column; gap:10px; align-items:flex-start;}\n.bub{font-size:15px; font-weight:500; color:var(--ink); background:var(--paper-2); border:1.5px solid var(--line-strong); padding:10px 16px; border-radius:18px; border-bottom-left-radius:5px;}\n.bub-b{margin-left:26px; animation-delay:.3s;}\n.bub-c{display:flex; gap:5px; margin-left:8px; padding:13px 16px;}\n.bub-c i{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:typing 1.2s infinite;}\n.bub-c i:nth-child(2){animation-delay:.18s;}\n.bub-c i:nth-child(3){animation-delay:.36s;}\n@keyframes typing{0%,60%,100%{opacity:.35; transform:translateY(0);}30%{opacity:1; transform:translateY(-4px);}}\n/* leaving avatars */\n.prop-team{display:flex; gap:18px;}\n.av{width:58px; height:58px; border-radius:50%; background:var(--accent); position:relative;}\n.av::after{content:\"\"; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.85);}\n.av2{opacity:.45;}\n.av3{background:transparent; border:2px dashed var(--line-strong);}\n.av3::after{background:var(--paper-3);}\n/* file stack */\n.prop-files{display:flex; align-items:flex-end; gap:-10px;}\n.fcard{width:86px; height:110px; border:1.5px solid var(--line-strong); border-radius:10px; background:var(--paper-2); box-shadow:0 10px 24px rgba(0,0,0,.32);}\n.fcard.f1{transform:rotate(-7deg) translateX(14px);}\n.fcard.f2{transform:rotate(3deg); z-index:1;}\n.fcard.f3{transform:rotate(10deg) translateX(-14px); display:flex; align-items:center; justify-content:center;}\n.fcard.f3 span{font-family:var(--display); font-weight:700; font-size:44px; color:var(--accent);}\n.cons-row{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2vw,24px); margin-top:clamp(48px,8vh,88px);}\n.scenario-line{\n  font-family:var(--display); font-weight:600; font-size:var(--t-display);\n  line-height:1.06; letter-spacing:-.025em; margin:0; text-wrap:balance; text-align:center;\n}\n.scenario-line.ghosting{color:var(--ghost);}\n.cons-card{border:1px solid var(--line); border-radius:var(--radius); padding:clamp(20px,2.4vw,30px); background:var(--paper);}\n.cons-card b{display:block; font-family:var(--display); font-weight:600; font-size:clamp(17px,1.7vw,21px); letter-spacing:-.015em; color:var(--ink); margin-bottom:8px;}\n.cons-card p{margin:0; font-size:15px; line-height:1.5; color:var(--ink-2);}\n@media(max-width:760px){ .cons-row{grid-template-columns:1fr;} }\n\n/* ---------- WHY IT MATTERS / STATS ---------- */\n.matters{padding-block:clamp(90px,16vh,180px); border-top:1px solid var(--line);}\n.stat-row{display:grid; grid-template-columns:1fr 1fr; gap:clamp(30px,5vw,90px); margin-top:clamp(50px,9vh,110px);}\n.stat{margin:0; border-top:2px solid var(--ink); padding-top:24px;}\n.stat-num{\n  font-family:var(--display); font-weight:700; font-size:var(--t-stat); line-height:.84;\n  letter-spacing:-.045em; color:var(--accent); margin-bottom:24px;\n}\n.stat-num span{font-size:.4em; vertical-align:super; margin-left:.02em; font-weight:600;}\n.stat-word{letter-spacing:-.035em;}\n.stat figcaption{font-size:clamp(16px,1.5vw,20px); line-height:1.5; color:var(--ink-2); max-width:34ch;}\n.stat figcaption b{color:var(--ink); font-weight:600;}\n.stat .src{display:block; margin-top:16px; font-family:var(--mono); font-size:11px; letter-spacing:.03em; color:var(--muted);}\n@media(max-width:760px){ .stat-row{grid-template-columns:1fr; gap:48px;} }\n\n/* ring gauges */\n.stat-gauge{border-top:none; padding-top:0;}\n.gauge{position:relative; width:clamp(150px,17vw,200px); aspect-ratio:1; margin-bottom:clamp(22px,2.6vw,32px);}\n.gauge-svg{width:100%; height:100%; transform:rotate(-90deg); overflow:visible;}\n.gauge-track{fill:none; stroke:var(--line); stroke-width:5;}\n.gauge-fill{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-dasharray:377; stroke-dashoffset:377; transition:stroke-dashoffset 1.5s var(--ease);}\n.gauge-fill.draw{stroke-dashoffset:283;}\n.no-motion .gauge-fill{transition:none;}\n.gauge-dash{fill:none; stroke:var(--accent); stroke-width:5; stroke-dasharray:3 13; stroke-linecap:round; transform-origin:center; animation:spinslow 16s linear infinite;}\n.no-motion .gauge-dash{animation:none;}\n.gauge-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:clamp(38px,5vw,60px); letter-spacing:-.04em; color:var(--ink);}\n.gauge-num span{font-size:.42em; font-weight:600; align-self:flex-start; margin-top:.55em; margin-left:.03em;}\n.gauge-word{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:clamp(24px,2.8vw,34px); letter-spacing:-.03em; color:var(--accent);}\n\n/* ---------- RESEARCH / CASE ---------- */\n.research{padding-block:clamp(90px,16vh,180px); border-top:1px solid var(--line);}\n.rq{display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:clamp(30px,5vh,56px); text-align:center;}\n.rq-tag{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}\n.rq-plain{margin:6px 0 0; font-size:clamp(15px,1.5vw,18px); line-height:1.55; color:var(--ink-2); max-width:52ch;}\n.rq-q{font-family:var(--display); font-weight:700; font-size:var(--t-display); line-height:1.06; letter-spacing:-.025em; margin:0; max-width:20ch; text-wrap:balance;}\n.subrq{display:flex; gap:clamp(20px,4vw,64px); margin-top:clamp(26px,4vh,44px); flex-wrap:wrap; justify-content:center; padding-left:0;}\n.subrq-item{flex:1; min-width:240px; font-size:16px; line-height:1.5; color:var(--ink-2); display:flex; gap:12px;}\n.subrq-item .n{font-family:var(--mono); color:var(--accent); font-size:13px; font-weight:700; padding-top:.15em; flex:none;}\n\n.ledger-head .kicker{justify-content:flex-start; text-align:left;}\n.ledger-head .kicker .idx::after{content:none;}\n\n.ledger{margin-top:clamp(56px,10vh,120px); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}\n.ledger-head{padding:clamp(24px,3vw,38px); border-bottom:1px solid var(--line); display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,5vw,80px); align-items:start;}\n.ledger-desc{margin:0; font-size:16px; line-height:1.55; color:var(--ink-2); max-width:62ch;}\n.ledger-rows{list-style:none; margin:0; padding:0;}\n.ledger-rows li{display:flex; align-items:baseline; gap:clamp(18px,3vw,42px); padding:clamp(14px,2vw,22px) clamp(24px,3vw,38px); border-bottom:1px solid var(--line); transition:background .2s;}\n@media (hover:hover) and (pointer:fine){\n.ledger-rows li:hover{background:var(--paper-2);}\n}\n.ledger .lv{font-family:var(--display); font-size:clamp(28px,3.2vw,44px); font-weight:700; color:var(--ink); min-width:2.8ch; text-align:right; letter-spacing:-.04em;}\n.ledger .lk{font-size:15px; color:var(--ink-2);}\n.ledger-foot{margin:0; padding:clamp(18px,2.4vw,26px) clamp(24px,3vw,38px); font-family:var(--mono); font-size:11.5px; letter-spacing:.02em; color:var(--muted); line-height:1.7;}\n@media(max-width:760px){ .ledger-head{grid-template-columns:1fr; gap:14px;} }\n\n/* ---------- FINDINGS ---------- */\n.findings{padding-block:clamp(90px,16vh,180px); border-top:1px solid var(--line);}\n.findings-intro{max-width:22ch;}\n.findings-hint{font-family:var(--sans); font-size:13px; letter-spacing:.02em; color:var(--muted); margin:20px 0 0; text-align:center;}\n.finding-list{margin-top:clamp(40px,7vh,72px); border-top:1px solid var(--line-strong);}\n.finding{border-bottom:1px solid var(--line-strong);}\n.finding-head{\n  width:100%; display:grid; grid-template-columns:auto 1fr auto; align-items:center;\n  gap:clamp(18px,3vw,44px); padding:clamp(22px,3.2vw,40px) 0; text-align:left;\n  color:var(--ink); transition:color .25s, padding-left .35s var(--ease);\n}\n.finding-n{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted); transition:color .25s;}\n.finding-title{\n  font-family:var(--display); font-weight:600; line-height:1.04; letter-spacing:-.028em;\n  font-size:var(--t-quote); text-wrap:balance;\n}\n.finding-toggle{position:relative; width:24px; height:24px; flex:none; justify-self:end;}\n.finding-toggle::before,.finding-toggle::after{content:\"\"; position:absolute; background:var(--ink-2); transition:transform .35s var(--ease), background .25s;}\n.finding-toggle::before{top:50%; left:0; right:0; height:2px; transform:translateY(-50%);}\n.finding-toggle::after{left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%);}\n.finding.open .finding-toggle::after{transform:translateX(-50%) scaleY(0);}\n.finding.open .finding-toggle::before{background:var(--accent);}\n@media (hover:hover) and (pointer:fine){\n.finding-head:hover{padding-left:14px;}\n.finding-head:hover .finding-n{color:var(--accent);}\n}\n.finding.open .finding-n{color:var(--accent);}\n\n/* expandable body via grid-rows trick */\n.finding-body{display:grid; grid-template-rows:0fr; transition:grid-template-rows .55s var(--ease);}\n.finding.open .finding-body{grid-template-rows:1fr;}\n.finding-body-inner{overflow:hidden; min-height:0;}\n.finding.open .finding-body-inner{padding-bottom:clamp(30px,5vw,56px);}\n/* speech-bubble quotes */\n.finding-body blockquote{\n  margin:0; font-family:var(--display); font-style:normal; font-weight:500;\n  font-size:clamp(19px,2.2vw,28px); line-height:1.3; letter-spacing:-.015em;\n  color:var(--ink); max-width:34ch; position:relative;\n  background:var(--feature); border-radius:24px; border-bottom-left-radius:6px;\n  padding:clamp(20px,2.6vw,32px) clamp(24px,3vw,40px);\n}\n.finding-body blockquote::before{content:none;}\n.finding-meta{display:flex; align-items:center; gap:14px; margin:clamp(18px,2.4vw,26px) 0 0; padding-left:12px;}\n.finding-meta .pid{font-family:var(--mono); font-weight:700; font-size:13px; color:var(--accent-ink); background:var(--accent); padding:3px 11px; letter-spacing:.02em; border-radius:100px;}\n.finding-meta .prole{font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--muted); text-transform:uppercase;}\n.finding-note{margin:clamp(18px,2.4vw,26px) 0 0; padding-left:12px; font-size:16px; line-height:1.55; color:var(--ink-2); max-width:54ch;}\n@media(max-width:600px){\n  .finding-meta,.finding-note{padding-left:0;}\n  /* badge and role stack rather than wrapping into a ragged centred block */\n  .finding-meta{flex-direction:column; gap:8px;}\n  .finding-meta .prole{text-align:center; line-height:1.4;}\n}\n\n/* ---------- SENSEMAKING CYCLE (dark) ---------- */\n.cycle{padding-block:clamp(90px,16vh,180px);}\n.cycle-head{display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:clamp(24px,4vh,44px); text-align:center;}\n.cycle-head .big-statement{margin:0 auto;}\n.cycle-lede{margin:0 auto; font-size:clamp(15px,1.5vw,18px); line-height:1.55; color:var(--ink-2); max-width:56ch; text-wrap:pretty;}\n.cycle-stage-tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:0; border:1px solid var(--line-dark); background:var(--line-dark); position:relative; border-radius:var(--radius) var(--radius) 0 0; overflow:hidden;}\n.cyc-tab{display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding:clamp(20px,2.4vw,30px); background:var(--dark); text-align:left; color:var(--on-dark-2); transition:background .3s, color .3s; position:relative;}\n.cyc-tab .cyc-n{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--on-dark-2); transition:color .3s;}\n.cyc-tab .cyc-t{font-family:var(--display); font-weight:600; font-size:clamp(18px,1.9vw,26px); letter-spacing:-.02em; color:var(--on-dark); line-height:1.05;}\n.cyc-tab .cyc-s{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--on-dark-2);}\n@media (hover:hover) and (pointer:fine){\n.cyc-tab:hover{background:var(--dark-2);}\n}\n.cyc-tab.active{background:var(--dark-2);}\n.cyc-tab.active .cyc-n{color:var(--accent);}\n/* continuous loop progress bar spanning all four stages */\n.cyc-progress{position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--line-dark); z-index:4;}\n.cyc-progress-fill{display:block; height:100%; width:0; background:var(--accent); will-change:width;}\n.cyc-loopback{display:block; text-align:right; margin:clamp(44px,7vh,84px) 0 12px; font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}\n.cycle-panels{border:1px solid var(--line-dark); border-top:none; background:var(--paper-2); border-radius:0 0 var(--radius) var(--radius); overflow:hidden;}\n.cyc-panel{display:none; padding:clamp(28px,4vw,52px);}\n.cyc-panel.active{display:block;}\n.cyc-panel-q{font-family:var(--display); font-weight:500; font-size:var(--t-quote); letter-spacing:-.025em; line-height:1.1; margin:0 0 clamp(22px,3vw,34px); color:var(--on-dark); max-width:22ch;}\n.cyc-panel ul{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,1fr); gap:14px 40px;}\n.cyc-panel li{font-size:16px; line-height:1.45; color:var(--on-dark-2); padding-left:22px; position:relative;}\n.cyc-panel li::before{content:\"\"; position:absolute; left:0; top:9px; width:9px; height:1px; background:var(--accent);}\n@media(max-width:820px){\n  .cycle-head{grid-template-columns:1fr; gap:18px;}\n  .cycle-stage-tabs{grid-template-columns:1fr 1fr;}\n  .cyc-panel ul{grid-template-columns:1fr;}\n}\n\n/* ---------- CENTRAL ARGUMENT (dark) ---------- */\n.argument{padding-block:clamp(110px,20vh,240px); text-align:center;}\n.argument-big{\n  font-family:var(--display); font-weight:700; letter-spacing:-.028em; line-height:1.1;\n  font-size:var(--t-display); margin:clamp(30px,5vh,56px) auto 0; max-width:26ch; color:var(--on-dark); text-wrap:balance;\n}\n.argument-big .strike{position:relative; color:var(--on-dark-2); white-space:nowrap;}\n.argument-big .strike::after{content:\"\"; position:absolute; left:-2px; right:-2px; top:54%; height:4px; background:var(--accent);}\n.argument-foot{margin:clamp(28px,4vh,44px) auto 0; font-size:clamp(16px,1.6vw,19px); line-height:1.55; color:var(--on-dark-2); max-width:50ch;}\n/* sits on the page ground like every other slide */\n.argument.dark{background:transparent; color:var(--ink);}\n\n/* ---------- THREE SOURCES ---------- */\n.sources{padding-block:clamp(90px,16vh,180px); border-top:1px solid var(--line);}\n.src-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,2vw,28px); margin-top:clamp(26px,4vh,52px);}\n.src-card{border:1px solid var(--line-strong); border-radius:var(--radius); padding:clamp(20px,2.4vw,32px); display:flex; flex-direction:column; min-height:0; transition:background .3s, transform .3s var(--ease), box-shadow .3s var(--ease);}\n.src-top{display:flex; align-items:center; gap:12px; margin-bottom:16px;}\n.src-n{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--accent);}\n.src-card h3{font-family:var(--display); font-weight:700; font-size:var(--t-title); letter-spacing:-.028em; margin:0; transition:color .3s;}\n.src-holds{font-size:17px; line-height:1.5; color:var(--ink-2); margin:0 0 auto; transition:color .3s;}\n.src-limit{margin-top:28px; padding-top:20px; border-top:1px solid var(--line); transition:border-color .3s;}\n.src-limit-tag{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:8px;}\n.src-limit p{margin:0; font-size:14.5px; line-height:1.5; color:var(--muted); transition:color .3s;}\n.src-foot{margin:clamp(40px,6vh,64px) auto 0; font-family:var(--display); font-weight:500; font-size:var(--t-quote); line-height:1.2; letter-spacing:-.02em; max-width:26ch; text-wrap:balance; text-align:center;}\n@media(max-width:820px){ .src-grid{grid-template-columns:1fr;} .src-card{min-height:0;} }\n\n/* ---------- DECISION TYPES (diagnostic) ---------- */\n.types{padding-block:clamp(90px,16vh,180px); border-top:1px solid var(--line);}\n.types-hint{font-size:clamp(15px,1.5vw,18px); color:var(--ink-2); margin:20px auto 0; max-width:44ch; text-align:center;}\n.types-ui{display:grid; grid-template-columns:1fr 1.1fr; gap:clamp(20px,3vw,48px); margin-top:clamp(40px,7vh,76px); align-items:start;}\n.types-pick{display:flex; flex-direction:column; gap:10px;}\n.type-btn{display:flex; flex-direction:column; gap:5px; text-align:left; min-height:44px; padding:clamp(20px,2vw,28px); border:1px solid var(--line-strong); border-radius:var(--radius-sm); background:transparent; transition:background .25s, border-color .25s, transform .25s var(--ease);}\n@media (hover:hover) and (pointer:fine){\n.type-btn:hover{border-color:var(--ink); transform:translateX(5px);}\n}\n.type-btn.active{background:var(--accent-soft); border-color:var(--accent);}\n.type-btn.active .type-k{color:var(--accent);}\n.type-k{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}\n.type-name{font-family:var(--display); font-weight:700; font-size:var(--t-title); letter-spacing:-.025em; color:var(--ink);}\n.type-ex{font-family:var(--mono); font-size:12px; color:var(--muted);}\n.types-detail{position:relative; border:1px solid var(--line-strong); border-radius:var(--radius); min-height:340px;}\n.type-panel{display:none; padding:clamp(26px,3vw,44px);}\n.type-panel.active{display:block;}\n.type-panel dl{margin:0; display:flex; flex-direction:column;}\n.type-panel dl > div{padding:clamp(18px,2.2vw,26px) 0; border-bottom:1px solid var(--line);}\n.type-panel dl > div:first-child{padding-top:0;}\n.type-panel dl > div:last-child{border-bottom:none; padding-bottom:0;}\n.type-panel dt{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}\n.type-panel dd{margin:0; font-family:var(--display); font-weight:500; font-size:clamp(19px,2vw,26px); line-height:1.16; letter-spacing:-.02em; color:var(--ink);}\n.type-panel dd.risk-hot{color:var(--accent);}\n@media(max-width:760px){ .types-ui{grid-template-columns:1fr;} .types-detail{min-height:0;} }\n\n/* ---------- RECOMMENDATIONS MATRIX (dark) ---------- */\n.recs{padding-block:clamp(90px,16vh,180px);}\n.recs-head{display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:clamp(24px,4vh,44px); text-align:center;}\n.recs-head .big-statement{margin:0 auto;}\n.recs-lede{margin:0 auto; font-size:clamp(15px,1.5vw,18px); line-height:1.55; color:var(--ink-2); max-width:48ch;}\n.matrix{\n  display:grid; grid-template-columns:1.1fr repeat(3,1fr); gap:1px;\n  margin-top:clamp(48px,8vh,90px); background:var(--line-dark); border:1px solid var(--line-dark);\n  border-radius:var(--radius); overflow:hidden;\n}\n.mx-corner{background:var(--paper);}\n.mx-col-h{background:var(--paper); padding:clamp(12px,1.25vw,18px); font-family:var(--display); font-weight:600; font-size:clamp(12.5px,1.2vw,16px); line-height:1.15; letter-spacing:-.02em; color:var(--on-dark); transition:color .3s; display:flex; flex-direction:column; gap:4px;}\n.mx-col-h span{font-family:var(--sans); font-size:10.5px; font-weight:400; letter-spacing:.02em; color:var(--on-dark-2); text-transform:none; line-height:1.3;}\n.mx-row-h{background:var(--paper); padding:clamp(12px,1.25vw,18px); font-family:var(--display); font-weight:600; font-size:clamp(13px,1.3vw,18px); letter-spacing:-.02em; color:var(--on-dark); display:flex; flex-direction:column; gap:3px; justify-content:center; transition:color .3s;}\n.mx-row-h span{font-family:var(--sans); font-size:10px; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--on-dark-2); line-height:1.3;}\n.mx-cell{\n  background:var(--paper); padding:clamp(12px,1.3vw,20px); text-align:left;\n  font-size:clamp(11.5px,1.05vw,14px); line-height:1.34; color:var(--on-dark-2);\n  transition:background .38s var(--ease), color .38s var(--ease); cursor:pointer; min-height:70px; -webkit-tap-highlight-color:transparent;\n}\n.mx-cell.mx-org{grid-column:span 3; cursor:default; color:var(--ink-2); background:var(--accent-soft); font-style:normal;}\n.mx-cell.lit{background:var(--paper-2); color:var(--ink);}\n@media (hover:hover) and (pointer:fine){ .mx-cell:hover{background:var(--paper-2); color:var(--ink);} }\n.mx-cell.active{background:var(--accent); color:var(--accent-ink); font-weight:500;}\n.mx-col-h.lit,.mx-row-h.lit{color:var(--accent);}\n@media(max-width:760px){\n  .recs-head{grid-template-columns:1fr; gap:16px;}\n  .matrix{grid-template-columns:1fr; gap:0; border:none;}\n  .mx-corner,.mx-col-h{display:none;}\n  .mx-row-h{border:1px solid var(--line-dark); border-bottom:none; margin-top:18px;}\n  .mx-cell{border:1px solid var(--line-dark); border-bottom:none; min-height:0;}\n  .mx-cell:last-child{border-bottom:1px solid var(--line-dark);}\n  .mx-cell::before{content:attr(data-label); display:block; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;}\n}\n\n/* ---------- CLOSING ---------- */\n.closing{padding-block:clamp(110px,20vh,240px); border-top:1px solid var(--line); text-align:center;}\n.closing .kicker{justify-content:center;}\n.closing-big{\n  font-family:var(--display); font-weight:700; letter-spacing:-.03em; line-height:1.08;\n  font-size:clamp(28px,4vw,56px); margin:clamp(32px,5vh,56px) auto 0; max-width:20ch; text-wrap:balance;\n}\n\n/* ---------- COLOPHON ---------- */\n.colophon{padding-block:clamp(56px,9vh,96px);}\n.colo-top{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:clamp(28px,4vh,44px); border-bottom:1px solid var(--line-dark);}\n.colo-title{font-family:var(--display); font-weight:700; font-size:clamp(24px,3vw,40px); letter-spacing:-.03em; color:var(--on-dark);}\n.colo-back{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--on-dark-2); text-decoration:none; transition:color .2s;}\n@media (hover:hover) and (pointer:fine){\n.colo-back:hover{color:var(--accent);}\n}\n.colo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(20px,3vw,44px); padding-block:clamp(32px,5vh,52px);}\n.colo-col .colo-k{display:block; font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}\n.colo-col p{margin:0; font-size:15px; line-height:1.5; color:var(--on-dark-2);}\n.colo-foot{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-top:clamp(24px,3vh,36px); border-top:1px solid var(--line-dark); font-family:var(--mono); font-size:11.5px; letter-spacing:.03em; color:var(--muted);}\n@media(max-width:760px){ .colo-grid{grid-template-columns:1fr 1fr;} }\n\n/* touch: tap feedback replaces hover */\n@media (hover:none){\n  .type-btn:active{border-color:var(--ink);}\n  .cyc-tab:active{background:var(--dark-2);}\n  .mx-cell:active{background:var(--paper-2); color:var(--ink);}\n  .finding-head:active .finding-n{color:var(--accent);}\n}\n\n/* short viewports: the four-level matrix has to fit one fixed page */\n@media (max-height:820px){\n  .matrix{margin-top:clamp(14px,2.2vh,28px);}\n  .mx-cell{min-height:54px; padding:clamp(9px,1vw,14px); font-size:clamp(10.5px,.95vw,12.5px); line-height:1.3;}\n  .mx-col-h{padding:clamp(9px,1vw,14px); font-size:clamp(11.5px,1.05vw,14px);}\n  .mx-col-h span{font-size:9.5px;}\n  .mx-row-h{padding:clamp(9px,1vw,14px); font-size:clamp(12px,1.1vw,15px);}\n  .mx-row-h span{font-size:9px;}\n  .recs-head{margin-bottom:0;}\n}\n\n/* short viewports: the three-source slide is a fixed page too */\n@media (max-height:820px){\n  .sources{padding-block:clamp(70px,12vh,120px);}\n  .src-grid{margin-top:clamp(18px,2.6vh,34px); gap:clamp(12px,1.6vw,20px);}\n  .src-card{padding:clamp(14px,1.7vw,22px);}\n  .src-card h3{font-size:clamp(15px,1.5vw,19px);}\n  .src-holds{font-size:13px;}\n  .src-limit p{font-size:12.5px; line-height:1.42;}\n  .src-foot{margin-top:clamp(14px,2.2vh,26px); font-size:clamp(12.5px,1.15vw,15px); line-height:1.45;}\n}\n\n/* ---------- shape markers for chapters 7, 8 and 9 ---------- */\n.sicon{width:clamp(20px,1.9vw,26px); height:auto; display:block; flex:none;}\n.ticon{width:clamp(17px,1.6vw,22px); height:auto; display:block; margin-bottom:2px;}\n.micon{width:clamp(16px,1.5vw,21px); height:auto; display:block; margin-bottom:2px;}\n@media (max-height:820px){\n  .sicon{width:clamp(17px,1.6vw,21px);}\n  .ticon{width:clamp(15px,1.4vw,18px);}\n  .micon{width:clamp(14px,1.3vw,17px);}\n}\n\n/* short viewports: the decision-type slide is a fixed page too */\n@media (max-height:820px){\n  .types{padding-block:clamp(70px,12vh,120px);}\n  .types-hint{margin-top:8px; font-size:13px;}\n  .types-ui{margin-top:clamp(16px,2.4vh,30px); gap:clamp(12px,1.6vw,22px);}\n  .types-pick{gap:7px;}\n  .type-btn{padding:clamp(10px,1.2vw,16px); min-height:0;}\n  .type-btn .type-name{font-size:clamp(14px,1.35vw,18px);}\n  .type-btn .type-ex{font-size:11.5px; line-height:1.35;}\n  .type-btn .type-k{font-size:9.5px;}\n  .types-detail{min-height:0;}\n  .type-panel{padding:clamp(14px,1.8vw,24px);}\n  .type-panel dt{font-size:9.5px;}\n  .type-panel dd{font-size:clamp(13px,1.25vw,16px); line-height:1.35;}\n}\n\n/* ---------- matrix: the selected move, explained ---------- */\n.mx-cell{position:relative;}\n.mx-cell::after{content:\"\"; position:absolute; right:8px; bottom:8px; width:5px; height:5px; border-radius:50%; background:var(--line-strong); transition:background .25s, transform .25s;}\n.mx-cell.active::after{background:var(--accent-ink); transform:scale(1.5);}\n/* the accordion body only exists on small screens */\n.mx-inline{display:none;}\n.mx-detail{margin-top:clamp(14px,2.2vh,26px); min-height:64px;}\n.mx-detail-body{opacity:0; transform:translateY(7px); transition:opacity .24s var(--ease), transform .24s var(--ease);}\n.mx-detail-body.shown{opacity:1; transform:none;}\n.mx-hint{transition:opacity .24s var(--ease);}\n.mx-hint{margin:0; text-align:center; font-size:13px; color:var(--muted);}\n.mx-where{margin:0 0 10px; display:flex; align-items:center; justify-content:center; gap:9px; font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}\n.mx-where-sep{color:var(--line-strong);}\n.mx-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,2.4vw,40px);}\n.mx-dt{display:block; font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}\n.mx-cols p{margin:0; font-size:clamp(12.5px,1.15vw,15px); line-height:1.45; color:var(--ink-2); text-wrap:pretty;}\n.mx-cols div:nth-child(2) p{color:var(--ink);}\n@media(max-width:760px){\n  /* stacked list: each cell becomes its own accordion, so the answer\n     opens where it was tapped instead of in a panel further down */\n  .mx-detail{display:none;}\n  .mx-cell{padding-right:40px;}\n  .mx-cell.active{background:var(--paper-2); color:var(--ink); font-weight:400; box-shadow:inset 3px 0 0 var(--accent);}\n  .mx-cell::after{right:16px; top:50%; bottom:auto; width:8px; height:8px; border-radius:0; background:none;\n    border-right:1.6px solid var(--muted); border-bottom:1.6px solid var(--muted);\n    transform:translateY(-70%) rotate(45deg); transition:transform .3s var(--ease), border-color .3s;}\n  .mx-cell.active::after{border-color:var(--accent); transform:translateY(-30%) rotate(-135deg) scale(1);}\n  .mx-cell.active{padding-bottom:0;}\n  .mx-inline{display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s var(--ease);}\n  .mx-cell.active .mx-inline{grid-template-rows:1fr;}\n  .mx-inline-in{overflow:hidden; min-height:0;}\n  .mx-il{display:block; padding-top:12px; font-size:12.5px; line-height:1.45; color:var(--ink-2);}\n  .mx-il:last-child{padding-bottom:14px;}\n  .mx-il b{display:block; margin-bottom:3px; font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);}\n}\n@media(max-width:820px){ .mx-cols{grid-template-columns:1fr; gap:14px;} }\n@media (max-height:820px){\n  .mx-detail{margin-top:clamp(10px,1.6vh,18px); min-height:52px;}\n  .mx-cols p{font-size:12px; line-height:1.38;}\n  .mx-where{font-size:10px; margin-bottom:7px;}\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   THE MISSING WHY — horizontal story shell\n   body.hstory = pinned horizontal mode · body.vstory = vertical fallback\n   ============================================================ */\n\n.story{position:relative;}\n.story-count{position:absolute; z-index:5; bottom:clamp(20px,4vh,38px); right:var(--gutter); font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.08em; color:var(--muted); font-variant-numeric:tabular-nums;}\n.story-dots{position:absolute; z-index:5; bottom:clamp(20px,4vh,38px); left:0; right:0; display:flex; justify-content:center; align-items:center; gap:20px; pointer-events:auto;}\n.story-dots button{position:relative; width:8px; height:8px; border-radius:50%; background:var(--paper-3); padding:0; transition:background .25s, transform .25s var(--ease); cursor:pointer; -webkit-tap-highlight-color:transparent;}\n.story-dots button::after{content:\"\"; position:absolute; left:50%; top:50%; width:44px; height:44px; transform:translate(-50%,-50%);}\n@media (hover:hover) and (pointer:fine){ .story-dots button:hover{background:var(--muted); transform:scale(1.3);} }\n.story-dots button.on{background:var(--accent); transform:scale(1.35);}\n.vstory .story-dots{display:none;}\n/* vertical mode: each part settles into view like the horizontal track,\n   but proximity (not mandatory) so tall slides never trap the scroll */\nbody.vstory{scroll-snap-type:y proximity;}\n.vstory .slide{scroll-snap-align:start;}\n\n/* ---------- HORIZONTAL MODE ---------- */\n.hstory .story-pin{position:sticky; top:0; height:100svh; overflow:hidden;}\n.hstory .story-track{display:flex; height:100svh; will-change:transform;}\n@media (prefers-reduced-motion: no-preference){\n  .hstory .story-track{transition:transform .7s cubic-bezier(.22,.68,.12,1);}\n}\n.hstory .slide{\n  flex:0 0 100vw; height:100svh; overflow:hidden; position:relative;\n  display:flex; flex-direction:column; align-items:center; justify-content:center; justify-content:safe center;\n  padding:clamp(100px,14vh,136px) var(--gutter) clamp(48px,8vh,80px) !important;\n  border-top:none !important; min-height:0 !important;\n}\n.hstory .slide > .kicker{position:absolute; top:clamp(60px,8.5vh,92px); left:0; right:0;}\n.hstory .slide .wrap{width:100%; max-width:var(--maxw); padding-inline:0; margin:0 auto;}\n\n/* per-slide reveal: hidden until slide activates */\n.hstory [data-reveal]{opacity:0; transform:translateY(22px);}\n.hstory .slide.active [data-reveal],.hstory [data-reveal].in{opacity:1; transform:none;}\n\n/* compact fits so every chapter sits in one screen */\n.hstory .big-statement{margin-top:14px;}\n.hstory .stat-row{margin-top:clamp(26px,5vh,52px);}\n.hstory .stat-num{font-size:clamp(48px,6.5vw,92px); margin-bottom:16px;}\n.hstory .rq{margin-top:10px;}\n.hstory .subrq{margin-top:clamp(22px,4vh,38px);}\n.hstory .ledger{margin-top:0; max-width:1000px; margin-inline:auto;}\n.hstory .ledger-head{padding:clamp(14px,1.8vh,24px) clamp(20px,2.4vw,32px); gap:clamp(14px,3vw,50px);}\n.hstory .ledger-desc{font-size:14px;}\n.hstory .ledger-rows li{padding:clamp(8px,1.4vh,15px) clamp(20px,2.4vw,32px); gap:clamp(14px,2.4vw,34px);}\n.hstory .ledger .lv{font-size:clamp(20px,2.4vw,34px);}\n.hstory .ledger .lk{font-size:14px;}\n.hstory .ledger-foot{padding:clamp(10px,1.6vh,16px) clamp(20px,2.4vw,32px); font-size:10.5px; line-height:1.5;}\n.hstory .cycle-head{margin-top:0;}\n.hstory .cycle-head .big-statement{margin-top:0;}\n.hstory .cycle-lede{font-size:14.5px;}\n.hstory .cyc-loopback{margin:clamp(10px,2vh,20px) 0 8px;}\n.hstory .cyc-tab{padding:clamp(12px,1.5vw,22px); gap:4px;}\n.hstory .cyc-panel{padding:clamp(16px,2.2vw,30px);}\n.hstory .cyc-panel-q{margin-bottom:clamp(12px,2vh,20px);}\n.hstory .matrix{margin-top:clamp(14px,2.6vh,26px);}\n.hstory .mx-cell{min-height:0; padding:clamp(11px,1.3vw,17px); font-size:clamp(12.5px,1.2vw,15px);}\n.hstory .mx-col-h,.hstory .mx-row-h{padding:clamp(11px,1.3vw,17px);}\n.hstory .recs-head{margin-top:0; gap:10px;}\n.hstory .types-ui{margin-top:clamp(18px,3.4vh,32px);}\n.hstory .types-detail{min-height:0;}\n.hstory .type-btn{padding:clamp(13px,1.5vw,20px);}\n.hstory .type-panel dl > div{padding:clamp(11px,1.7vh,18px) 0;}\n.hstory .src-grid{margin-top:clamp(18px,3.4vh,32px);}\n.hstory .src-card{min-height:0; padding:clamp(18px,2vw,30px);}\n.hstory .src-holds{font-size:15px;}\n.hstory .src-limit p{font-size:13.5px;}\n.hstory .src-limit{margin-top:16px; padding-top:13px;}\n.hstory .src-foot{margin-top:clamp(16px,3vh,28px);}\n.hstory .gist-list{margin-top:clamp(20px,4vh,40px);}\n.hstory .hero{padding-bottom:clamp(80px,12vh,110px) !important;}\n.hstory .hero .scroll-cue{position:absolute;}\n\n/* marquee band pinned to the gist slide bottom */\n.hstory .gist .marquee{position:absolute; left:0; right:0; bottom:clamp(56px,9vh,86px); border-bottom:none; padding:clamp(12px,2vh,20px) 0;}\n.hstory .gist .m-item{font-size:clamp(22px,3vw,40px);}\n\n/* scenario scene */\n.sc-stage{display:flex; flex-direction:column; align-items:center; gap:clamp(26px,5vh,48px);}\n.sc-stage .cons-row{margin-top:0; max-width:1080px;}\n.hs-cons-title{margin:0; font-family:var(--display); font-weight:600; font-size:var(--t-title); letter-spacing:-.02em; text-align:center;}\n\n/* finding slides */\n.slide-finding .wrap{display:flex; flex-direction:column; align-items:center; text-align:center; gap:clamp(14px,2.6vh,22px); max-width:860px;}\n.fs-count{margin:0; font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}\n.slide-finding .finding-title{font-size:var(--t-display); line-height:1.06; max-width:20ch; text-wrap:balance;}\n.fq{\n  margin:clamp(6px,1.4vh,12px) 0 0; font-family:var(--display); font-weight:500;\n  font-size:clamp(18px,2.1vw,27px); line-height:1.34; letter-spacing:-.015em; color:var(--ink);\n  background:var(--feature); border-radius:24px; border-bottom-left-radius:6px;\n  padding:clamp(20px,2.6vw,34px) clamp(24px,3.2vw,44px); max-width:38ch; text-align:left;\n}\n.slide-finding .finding-meta{margin:0; padding:0; justify-content:center;}\n.slide-finding .finding-note{margin:0; padding:0; max-width:52ch; text-align:center;}\n.term-gloss{margin:0; font-size:13px; font-style:italic; color:var(--muted); text-align:center;}\n.term-gloss::before{content:\"*\"; margin-right:3px; font-style:normal; color:var(--accent);}\n\n/* closing credits */\n.mini-colo{position:absolute; bottom:clamp(74px,11vh,116px); left:var(--gutter); right:var(--gutter); max-width:820px; margin-inline:auto; display:flex; justify-content:center; flex-wrap:wrap; gap:8px 22px; font-size:12.5px; line-height:1.4; color:var(--muted); text-align:center;}\n.mini-colo span{flex:0 1 auto; min-width:0;}\n@media(max-width:860px){ .mini-colo{position:relative; bottom:auto; left:auto; right:auto; margin-top:clamp(28px,5vh,44px); flex-direction:column; gap:6px;} }\n\n/* nav flips light while dark/accent slides are active */\n.topnav{transition:color .4s, filter .4s;}\nbody.on-dark-slide .topnav{color:#F4F3F0;}\nbody.on-dark-slide .topnav .brand .mk{background:#F4F3F0;}\n\n/* ---------- CHAPTER 6 · quote on black ---------- */\n.hstory .slide.torch,.vstory .slide.torch{background:#121214; color:#F4F3F0;}\n.slide.torch > .kicker{color:rgba(244,243,240,.6); z-index:3;}\n.slide.torch > .kicker .idx{color:var(--accent);}\n.torch-wrap{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; gap:clamp(16px,3vh,26px); max-width:900px;}\n.torch-q{background:rgba(244,243,240,.07); color:#F4F3F0; max-width:44ch;}\n.slide.torch .finding-meta{justify-content:center; padding:0; margin:0;}\n.slide.torch .finding-meta .prole{color:rgba(244,243,240,.55);}\n.torch-note{color:rgba(244,243,240,.72); max-width:52ch; text-align:center; margin:0; padding:0;}\n\n/* ---------- VERTICAL FALLBACK (small screens / motion off) ---------- */\n.vstory .story-count{display:none;}\n/* centred flex children size to content, so anything wider than the\n   viewport (the marquee track, long lines) leaked sideways */\n.vstory .slide > *{max-width:100%;}\n.vstory .story-track{display:block;}\n.vstory .slide{position:relative; padding:clamp(70px,11vh,110px) var(--gutter); border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:center;}\n.vstory .slide > .kicker{margin-bottom:clamp(26px,4vh,44px);}\n.vstory .slide .wrap{width:100%; max-width:var(--maxw); padding-inline:0;}\n.vstory .slide.hero{min-height:100svh; justify-content:center; border-top:none;}\n.vstory .hero .scroll-cue{position:absolute;}\n.vstory .gist .marquee{align-self:stretch; width:auto; max-width:none; margin:clamp(40px,7vh,70px) calc(-1 * var(--gutter)) calc(-1 * clamp(70px,11vh,110px));}\n.vstory .sc-stage{gap:clamp(24px,4vh,40px);}\n.vstory .slide-finding .wrap{display:flex; flex-direction:column; align-items:center; text-align:center; gap:18px; max-width:860px;}\n.vstory .mini-colo{position:static; margin-top:clamp(36px,6vh,60px);}\n.vstory [data-reveal]{opacity:0; transform:translateY(22px);}\n.vstory [data-reveal].in{opacity:1; transform:none;}\n<\u002Fstyle>\n<style>/* ============================================================\n   INTRO — full-screen dark scrolltelling shape sorter\n   ============================================================ */\n.intro{position:relative; height:480vh; background:var(--paper); color:var(--ink);}\n.intro-pin{position:sticky; top:0; height:100svh; overflow:hidden; display:grid; place-items:center;}\n/* glow sits at the TOP, so the foot of the intro is flat ground and meets the story with no seam */\n.intro-pin::before{content:\"\"; position:absolute; inset:0; background:radial-gradient(126% 88% at 50% 6%, rgba(77,130,255,.22), transparent 64%); pointer-events:none;}\n\n/* --- copy stack (top half) --- */\n.intro-copy{position:absolute; inset:0; display:grid; align-content:center; place-items:center; padding-inline:var(--gutter); text-align:center; z-index:2;}\n.intro-title,.icap{grid-area:1/1; margin:0; max-width:19ch; will-change:opacity,transform;}\n.intro-title{font-family:var(--display); font-weight:700; font-size:clamp(46px,7.4vw,124px); line-height:.86; letter-spacing:-.04em;}\n.intro-title .l{display:block;}\n.intro-title em{font-style:normal; color:#FFC97A;}\n.icap{font-family:var(--display); font-weight:600; font-size:clamp(26px,3.9vw,62px); line-height:1.08; letter-spacing:-.03em; color:#F4F3F0; opacity:0; text-wrap:pretty;}\n.icap b{font-weight:600; color:#B49CFF;}\n.icap em{font-style:normal; color:#FFC97A;}\n\n/* --- drifting shapes --- */\n.intro-shapes{position:absolute; inset:0; z-index:1; pointer-events:none;}\n.intro-shapes .sh{position:absolute; display:block; will-change:transform,opacity; opacity:0;}\n.intro-shapes .sh[data-sh=\"0\"]{left:6%;  top:24%; width:clamp(78px,9.5vw,150px);}\n.intro-shapes .sh[data-sh=\"1\"]{right:8%; top:16%; width:clamp(70px,8.4vw,132px);}\n.intro-shapes .sh[data-sh=\"2\"]{left:15%; bottom:12%; width:clamp(66px,7.8vw,124px);}\n.intro-shapes .sh[data-sh=\"3\"]{right:14%;bottom:18%; width:clamp(60px,7vw,112px);}\n.intro-shapes .sh[data-sh=\"4\"]{left:40%; bottom:5%;  width:clamp(52px,6vw,96px);}\n.intro-shapes .sh[data-sh=\"5\"]{right:32%;top:8%;     width:clamp(50px,5.6vw,90px);}\n\n/* --- closing panel --- */\n.intro-end{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(28px,5vh,56px); padding-inline:var(--gutter); text-align:center; opacity:0; pointer-events:none; z-index:3;}\n.intro-final{margin:0; max-width:22ch; font-family:var(--display); font-weight:600; font-size:clamp(28px,4.4vw,70px); line-height:1.06; letter-spacing:-.032em; text-wrap:pretty;}\n.intro-final em{font-style:normal; color:#FFC97A;}\n.intro-meta{display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(24px,4vw,64px);}\n.intro-meta .col{font-family:var(--sans); font-size:14px; line-height:1.45; color:#F4F3F0;}\n.intro-meta .t{display:block; color:#FFC97A; text-transform:uppercase; letter-spacing:.11em; font-size:10.5px; font-weight:600; margin-bottom:8px; white-space:nowrap;}\n\n/* --- scroll cue --- */\n.intro-cue{position:absolute; bottom:clamp(18px,3.4vh,32px); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:10px; z-index:4;\n  font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:rgba(244,243,240,.62); transition:opacity .5s var(--ease);}\n.intro-cue i{width:1px; height:34px; background:linear-gradient(rgba(244,243,240,.7), transparent);}\n\n/* nav + brand flip light over the dark intro */\nbody.intro-dark .topnav{color:#F4F3F0;}\nbody.intro-dark .topnav .brand{color:#F4F3F0;}\n.no-motion .intro{height:auto;}\n.no-motion .intro-pin{position:relative; min-height:100svh;}\n.no-motion .intro-title{display:none;}\n.no-motion .icap{position:relative; opacity:1; grid-area:auto; margin-bottom:14px;}\n.no-motion .intro-end{position:relative; opacity:1; inset:auto; margin-top:40px;}\n@media(max-width:860px){\n  .intro{height:420vh;}\n  /* tighter wrap on phone widths */\n  .intro-title,.icap{max-width:15ch;}\n  .intro-shapes .sh{width:clamp(46px,13vw,78px) !important;}\n  .intro-shapes .sh[data-sh=\"4\"],.intro-shapes .sh[data-sh=\"5\"]{display:none;}\n}\n\n.no-motion .intro-shapes .sh{opacity:.9;}\n<\u002Fstyle>\n<style>/* ============================================================\n   FIGURES — faithful recreations of the thesis figures\n   Line-art, monochrome, thin strokes; the thesis style on dark ground\n   ============================================================ */\n\n.fig-cap{margin:clamp(16px,2.4vh,26px) auto 0; max-width:64ch; text-align:center; font-size:13px; line-height:1.5; color:var(--muted);}\n\n/* narration: the line lands before the diagram builds under it */\n.fig-lede{\n  margin:0 auto clamp(20px,3vh,34px); max-width:34ch; text-align:center;\n  font-family:var(--display); font-weight:600;\n  font-size:clamp(21px,2.5vw,36px); line-height:1.12; letter-spacing:-.028em;\n  color:var(--ink); text-wrap:pretty;\n}\n.fig-lede .why{color:var(--accent); border:0;}\n@media(max-width:860px){ .fig-lede{font-size:clamp(19px,5.4vw,26px); max-width:26ch;} }\n\n/* ---------- FIGURE 6 · the sensemaking cycle (2x2) ---------- */\n.fig6{\n  position:relative; display:grid; grid-template-columns:1fr 1fr;\n  gap:clamp(52px,6.4vw,104px); margin-top:0;\n}\n.f6box{border:1px solid var(--ink); border-radius:var(--radius); padding:clamp(14px,1.7vw,24px) clamp(16px,2vw,28px) clamp(16px,2vw,26px); text-align:center;}\n.f6ico{display:block; width:clamp(22px,2vw,30px); height:auto; margin:0 auto clamp(8px,1.1vh,12px);}\n.f6box h3{margin:0; font-family:var(--display); font-weight:700; font-size:clamp(17px,1.9vw,25px); letter-spacing:-.02em; color:var(--ink);}\n.f6box .f6sub{margin:3px 0 0; font-style:italic; font-size:clamp(12.5px,1.15vw,15px); color:var(--ink-2);}\n.f6box hr{width:64px; height:0; border:0; border-top:1px solid var(--ink-2); margin:clamp(10px,1.4vh,15px) auto clamp(12px,1.7vh,18px);}\n.f6box ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:clamp(7px,1.1vh,11px); text-align:left;}\n.f6box li{position:relative; padding-left:15px; font-size:clamp(12.5px,1.13vw,15.5px); line-height:1.4; color:var(--ink-2); text-wrap:pretty;}\n.f6box li::before{content:\"•\"; position:absolute; left:0; color:var(--ink-2);}\n\n.f6note{\n  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);\n  margin:0; text-align:center; font-style:italic; line-height:1.4;\n  font-size:clamp(12.5px,1.2vw,16px); color:var(--ink-2); white-space:nowrap;\n}\n.f6arw{position:absolute; fill:none; stroke:var(--ink-2); stroke-width:1.5; overflow:visible;}\n.f6arw .hd{fill:var(--ink-2); stroke:none;}\n.f6arw.a1,.f6arw.a3{width:clamp(34px,4vw,58px); height:clamp(17px,2vw,29px); left:50%; transform:translateX(-50%);}\n.f6arw.a2,.f6arw.a4{width:clamp(17px,2vw,29px); height:clamp(34px,4vw,58px); top:50%; transform:translateY(-50%);}\n.f6arw.a1{top:24%;}\n.f6arw.a3{bottom:24%;}\n.f6arw.a2{right:3%;}\n.f6arw.a4{left:3%;}\n\n@media(max-width:860px){\n  .fig6{grid-template-columns:1fr; gap:26px;}\n  .f6note{position:relative; left:auto; top:auto; transform:none; white-space:normal; margin:4px 0;}\n  .f6arw{display:none;}\n}\n\n/* ---------- per-chapter highlight ----------\n   Each chapter takes one colour from the poster palette. Overriding --accent\n   on the section cascades to every highlight inside it (eyebrow index, .why,\n   participant badges, accent fills) with no per-element rules. */\n.hl-amber ,.hl-amber.dark {--accent:#FFC97A; --accent-press:#E8A548; --accent-ink:#16151C; --accent-soft:rgba(255,201,122,.14);}\n.hl-lilac ,.hl-lilac.dark {--accent:#B49CFF; --accent-press:#8E6FE8; --accent-ink:#16151C; --accent-soft:rgba(180,156,255,.15);}\n.hl-green ,.hl-green.dark {--accent:#3BD08D; --accent-press:#22A96C; --accent-ink:#0E1A14; --accent-soft:rgba(59,208,141,.14);}\n.hl-cobalt,.hl-cobalt.dark{--accent:#8AB0FF; --accent-press:#4D82FF; --accent-ink:#0D1428; --accent-soft:rgba(138,176,255,.15);}\n\n/* ---------- nested levels ---------- */\n/* Explicit track + explicit height on the diagram. An `auto` grid track holding\n   an aspect-ratio box can create a circular sizing dependency that hangs layout.\n   The pair is centred as a unit: fit-content width + auto margins. */\n.fig7-holder{\n  position:relative; display:grid;\n  grid-template-columns:var(--f7size) minmax(0,var(--f7keyw));\n  align-items:center; gap:clamp(24px,3.4vw,56px);\n  width:fit-content; margin:clamp(16px,2.4vh,30px) auto 0;\n  --f7size:clamp(210px,38vh,340px); --f7keyw:min(46ch,44vw);\n}\n.fig7{position:relative; width:var(--f7size); height:var(--f7size); justify-self:center; font-size:max(9.5px, calc(var(--f7size) * 0.04));}\n.f7c{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border:1px solid var(--line-strong); border-radius:50%;}\n/* each level's solid sits on its own ring, breaking the stroke */\n.f7dot{position:absolute; left:50%; top:0; transform:translate(-50%,-50%); width:clamp(15px,4.6%,22px); min-width:15px; box-sizing:content-box; padding:3px 5px; background:var(--bg);}\n.f7c.c4 .f7dot{padding:3px 4px;}\n.f7c.c1{width:100%; height:100%;}\n.f7c.c2{width:74%; height:74%;}\n.f7c.c3{width:48%; height:48%;}\n.f7c.c4{width:26%; height:26%;}\n/* leader lines are drawn by script into an overlay spanning both columns */\n.f7wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0;}\n.f7wires path{fill:none; stroke:var(--line-strong); stroke-width:1;}\n.f7wires circle{fill:var(--ink);}\n@media(max-width:980px){ .f7wires{display:none;} }\n.f7key{position:relative; z-index:1; margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:clamp(12px,1.7vh,18px); min-width:0; justify-self:start;}\n.f7key li{display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:11px; align-items:start; min-width:0;}\n.f7key .f7ico{width:clamp(15px,1.4vw,20px); margin:2px 0 0;}\n.f7key b{grid-column:2; min-width:0; font-family:var(--display); font-weight:700; font-size:clamp(13px,1.2vw,17px); letter-spacing:-.015em; color:var(--ink);}\n.f7key span{grid-column:2; min-width:0; margin-top:2px; font-size:clamp(12px,1.05vw,14.5px); line-height:1.42; color:var(--ink-2); text-wrap:pretty;}\n\n.fig7-note{\n  grid-column:1 / -1; margin:clamp(14px,2.2vh,22px) 0 0; text-align:center;\n  font-style:italic; font-size:clamp(11.5px,1.05vw,14px); line-height:1.4; color:var(--muted);\n}\n\n@media(max-width:980px){\n  .fig7-holder{grid-template-columns:minmax(0,1fr); justify-items:center; gap:20px; --f7size:clamp(190px,74vw,290px);}\n  .f7key{justify-self:center; max-width:46ch;}\n}\n\n/* NOTE: no full-page grain overlay. A fixed, viewport-sized noise layer with\n   mix-blend-mode forces the compositor to re-blend a very tall document on\n   every scroll frame, which locked up the page. The flat ground stands alone. */\n\n/* the poster's palettes stay available for the gist column icons */\n.p-lilac {--f1:#B49CFF; --f2:#8E6FE8; --f3:#684AB8;}\n.p-amber {--f1:#FFC97A; --f2:#E8A548; --f3:#B87D22;}\n.p-green {--f1:#3BD08D; --f2:#22A96C; --f3:#137C4C;}\n.p-cobalt{--f1:#4D82FF; --f2:#2B57D8; --f3:#1637A9;}\n\n/* short viewports: the slide is a fixed page, so the figure has to give way */\n@media (max-height:820px){\n  .fig-lede{font-size:clamp(18px,2.1vw,26px); margin-bottom:clamp(12px,2vh,20px); max-width:40ch;}\n  .fig6{gap:clamp(30px,3.6vw,56px);}\n  .f6box{padding:clamp(10px,1.2vw,16px) clamp(12px,1.4vw,20px) clamp(12px,1.4vw,18px);}\n  .f6box h3{font-size:clamp(15px,1.5vw,19px);}\n  .f6box .f6sub{font-size:clamp(11px,1vw,13px);}\n  .f6box hr{margin:6px auto 8px; width:48px;}\n  .f6box ul{gap:5px;}\n  .f6box li{font-size:clamp(11.5px,1vw,13.5px); line-height:1.34;}\n  .f6ico{width:clamp(17px,1.5vw,22px); margin-bottom:6px;}\n  .fig-cap{margin-top:clamp(10px,1.6vh,18px); font-size:12px;}\n  .fig7-holder{--f7size:clamp(200px,34vh,280px); --f7keyw:min(42ch,42vw); gap:clamp(18px,2.6vw,36px);}\n  .f7key{gap:clamp(9px,1.4vh,14px);}\n  .f7key b{font-size:clamp(12px,1.1vw,15px);}\n  .f7key span{font-size:clamp(11px,.98vw,13px); line-height:1.35;}\n}\n@media (max-height:640px){\n  .fig6{gap:22px;}\n  .f6box li{font-size:11px;}\n  .fig7-holder{--f7size:clamp(195px,30vh,240px); gap:14px;}\n  .f7key{gap:7px;}\n  .f7key b{font-size:12px;}\n  .f7key span{font-size:10.5px; line-height:1.3;}\n  .fig7-note{margin-top:8px; font-size:11px;}\n  .fig-lede{font-size:17px; margin-bottom:10px;}\n<\u002Fstyle>\n<style>/* ============================================================\n   MOTION — entrance gestures per content role + ambient drift\n   Every rule pairs a start state with its .in state at equal\n   specificity, so the base reveal primitive is never left stuck.\n   ============================================================ */\n@media (prefers-reduced-motion: no-preference){\n\n/* ---- kickers arrive from above, content from below ---- */\n.slide .kicker[data-reveal]{transform:translateY(-14px);}\n.slide .kicker[data-reveal].in{transform:none;}\n\n/* ---- Part 1 · story lines slide in from the left ---- */\n.sc .scenario-line[data-reveal]{transform:translateX(-38px);}\n.sc .scenario-line[data-reveal].in{transform:none;}\n.sc .cons-row[data-reveal]{transform:none;}\n.sc .cons-row:not(.in) .cons-card{opacity:0; transform:translateY(30px) scale(.97);}\n.sc .cons-row.in .cons-card{animation:mRise .75s var(--ease) both;}\n.sc .cons-row.in .cons-card:nth-child(2){animation-delay:.12s;}\n.sc .cons-row.in .cons-card:nth-child(3){animation-delay:.24s;}\n\n/* ---- stats count up out of a scale ---- */\n.matters .stat[data-reveal]{transform:translateY(24px) scale(.94);}\n.matters .stat[data-reveal].in{transform:none;}\n\n/* ---- the research question opens outward ---- */\n.research .rq[data-reveal]{transform:scale(.95);}\n.research .rq[data-reveal].in{transform:none;}\n.research .subrq:not(.in) .subrq-item{opacity:0; transform:translateX(-22px);}\n.research .subrq.in .subrq-item{animation:mSlideL .7s var(--ease) both;}\n.research .subrq.in .subrq-item:nth-child(2){animation-delay:.12s;}\n\n/* ---- findings: quote from the left, attribution from the right ---- */\n.slide-finding .fq[data-reveal]{transform:translateX(-30px);}\n.slide-finding .fq[data-reveal].in{transform:none;}\n.slide-finding .finding-meta[data-reveal],.slide-finding .finding-note[data-reveal]{transform:translateX(26px);}\n.slide-finding .finding-meta[data-reveal].in,.slide-finding .finding-note[data-reveal].in{transform:none;}\n\n/* ---- the loop: each stage enters from its own corner ---- */\n.fig6 .f6box[data-reveal-d=\"2\"]{transform:translate(-26px,-20px);}\n.fig6 .f6box[data-reveal-d=\"3\"]{transform:translate(26px,-20px);}\n.fig6 .f6box[data-reveal-d=\"4\"]{transform:translate(-26px,20px);}\n.fig6 .f6box[data-reveal-d=\"5\"]{transform:translate(26px,20px);}\n.fig6 .f6box[data-reveal-d=\"2\"].in,.fig6 .f6box[data-reveal-d=\"3\"].in,\n.fig6 .f6box[data-reveal-d=\"4\"].in,.fig6 .f6box[data-reveal-d=\"5\"].in{transform:none;}\n/* arrows draw themselves once the boxes are in */\n.fig6 .f6arw path:first-child{stroke-dasharray:90; stroke-dashoffset:90;}\n.slide.cycle.active .f6arw path:first-child{animation:mDraw 1.1s var(--ease) forwards;}\n.slide.cycle.active .f6arw.a1 path:first-child{animation-delay:.5s}\n.slide.cycle.active .f6arw.a2 path:first-child{anima
